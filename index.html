.center{max-width:480px;margin:12vh auto;text-align:center;padding:0 16px}

.dlg{border-radius:18px;overflow:hidden;border:0}

<script>
'use strict';
/* ================= Tiện ích ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=typeof v==='number'?v:parseFloat(String(v??'').replace(/[^\d.\-]/g,''));return isFinite(n)?n:0};
const vnd=n=>new Intl.NumberFormat('vi-VN',{maximumFractionDigits:0}).format(Math.round(n||0));
const qf=n=>new Intl.NumberFormat('vi-VN',{maximumFractionDigits:3}).format(+(n||0));
const p2=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const today=()=>dstr(new Date());
const dmy=iso=>iso?String(iso).slice(0,10).split('-').reverse().join('/'):'';
const days=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().trim();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const arr=o=>Object.entries(o||{}).map(([id,d])=>({id,...d}));
const sum=(a,f)=>a.reduce((s,x)=>s+num(f(x)),0);
const digits=s=>String(s||'').replace(/\D/g,'');
function h32(s,k){let h=k?0:5381;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h=k?((c+(h<<6)+(h<<16)-h)>>>0):(((h<<5)+h+c)>>>0)}return h.toString(36)}
const ivId=k=>'iv'+h32(k,0)+h32(k,1);
const txKey=(acc,date,amount,desc,bal)=>[acc,date,Math.round(num(amount)),norm(desc).replace(/\s+/g,' ').slice(0,60),bal===undefined||bal===''||bal===null?'':Math.round(num(bal))].join('|');
const txId=k=>'bt'+h32(k,0)+h32(k,1);
const START='2026-01-01';
const COMPANY={name:'Công ty TNHH Thi Đạt',mst:'0312510655'};
// Thông tin đăng ký của công ty (theo bảng thông tin chị gửi). Số tài khoản ngân hàng không lưu ở đây.
const CO={name:'CÔNG TY TNHH THI ĐẠT',mst:'0312510655',address:'D16/21/1, Ấp 22, Xã Tân Vĩnh Lộc, Thành phố Hồ Chí Minh',office:'78 đường 24B, Phường An Lạc, Thành phố Hồ Chí Minh',email:'thidat.co@gmail.com',invEmail:'thidat.kt@gmail.com',director:'Phạm Thị Huyền Thi',phone:'0858.301.301'};
const mstOk=m=>{const d=String(m||'').replace(/\D/g,'');if(d.length!==10&&d.length!==13)return false;const w=[31,29,23,19,17,13,7,5,3];let t=0;for(let i=0;i<9;i++)t+=+d[i]*w[i];return 10-(t%11)===+d[9]};
function invIssues(i){ // các lỗi thông tin trên hóa đơn
  const out=[],us=i.us;
  if(us){const nm=norm(us.name).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' '),ad=norm(us.address).replace(/\s+/g,' ');
    if(String(us.mst||'').replace(/\D/g,'')!==CO.mst)out.push({k:'bad',t:'Sai mã số thuế công ty: '+(us.mst||'(trống)')});
    if(!/thi dat/.test(nm)||!/tnhh|trach nhiem huu han/.test(nm))out.push({k:'bad',t:'Sai tên công ty: '+(us.name||'(trống)')});
    if(!us.address)out.push({k:'warn',t:'Thiếu địa chỉ công ty'});
    else if(!/d16\/21\/1/.test(ad.replace(/\s/g,''))||!/tan vinh loc/.test(ad)||!/\bap\s*22\b/.test(ad)||/binh chanh|vinh loc a|huyen/.test(ad))out.push({k:'bad',t:'Sai địa chỉ trụ sở: '+us.address});
    if(i.dir==='in'&&us.email&&!/thidat\.(kt|co)@gmail\.com/i.test(us.email))out.push({k:'warn',t:'Email nhận hóa đơn khác: '+us.email})}
  const d=String(i.mst||'').replace(/\D/g,'');
  if(d.length>=10&&!mstOk(i.mst))out.push({k:'bad',t:'Mã số thuế '+(i.dir==='in'?'người bán':'người mua')+' không hợp lệ: '+i.mst});
  if(i.dir==='out'&&d.slice(0,10)===CO.mst)out.push({k:'bad',t:'Hóa đơn đầu ra xuất cho chính công ty'});
  return out;
}
let issMemo={v:-1};
function invIssueList(){if(issMemo.v===ver)return issMemo.r;const r=[];goodInv().forEach(i=>{const x=invIssues(i);if(x.length)r.push({i,x})});r.sort((a,b)=>String(b.i.date).localeCompare(String(a.i.date)));issMemo={v:ver,r};return r}

const OURMST=()=>digits((S.settings.company||{}).mst||COMPANY.mst);

/* ================= Trạng thái ================= */
const COLS=['bank','bankTx','invoices','items','convs','inbox','users','requests','partners','quotes','contracts','cc_emps','cc_projects','cc_ts','cost','costmark','forms'];
const S={settings:{},sync:{},syncReq:null,log:{}};COLS.forEach(c=>S[c]={});
const PERS={bank:new Set(),bankTx:new Set()}; // tài khoản/giao dịch cá nhân nằm ở vùng riêng chỉ chủ xem được
const isOwner=()=>!!(usr&&usr.isOwner&&usr.isOwner());
const persOf=(c,id,d)=>{if(c==='bank'){if(PERS.bank.has(id))return true;if(S.bank[id])return false;return !!d&&d.type==='canhan'}
  if(c==='bankTx'){const a=(d&&d.accountId)||(S.bankTx[id]||{}).accountId;return !!a&&((S.bank[a]||{}).type==='canhan')}return false};
const colOf=(c,id,d)=>persOf(c,id,d)?(c==='bank'?'pbank':'pbankTx'):c;
let db=null,usr=null,dl=null,me=null,role=null,ver=0,view='dash',names={};
const st={}; // bộ lọc theo màn hình
const VIEWS={},A={};
const canWrite=()=>role==='admin'||role==='ketoan';

async function pool(items,fn,n,onProg){let i=0,done=0;const w=async()=>{while(i<items.length){const k=i++;await fn(items[k]);done++;if(onProg&&(done%10===0||done===items.length))onProg(done,items.length)}};await Promise.all(Array.from({length:Math.min(n||4,items.length||1)},w))}

function parseDate(v){
  if(v instanceof Date)return dstr(v);
  if(typeof v==='number'&&v>30000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate())}
  const m=String(v||'').match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);if(m)return m[3]+'-'+p2(m[2])+'-'+p2(m[1]);
  const m2=String(v||'').match(/(\d{4})-(\d{2})-(\d{2})/);return m2?m2[0]:null;
}
function moneyNum(v){
  if(typeof v==='number')return v;let s=String(v??'').trim().replace(/[^\d.,\-]/g,'');if(!s||s==='-')return 0;
  const neg=s.startsWith('-');s=s.replace(/-/g,'');
  if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s))s=s.replace(/,/g,'');else s=s.replace(/,/g,'.');
  const n=parseFloat(s)||0;return neg?-n:n;
}

function debtRows(dir){const g={};goodInv(dir).filter(i=>(i.date||'')>=START).forEach(i=>{const p=payOf(i),left=p.st==='done'?0:Math.max(0,num(i.total)-p.paid-p.adv);if(left<=1000)return;

/* ---- Thuế GTGT đầu ra và đầu vào từ 1/1 đến nay ---- */
function vatCard(){const y=new Date().getFullYear(),today=new Date().toISOString().slice(0,10),curQ=Math.floor(new Date().getMonth()/3)+1;
  // Luật GTGT 48/2024/QH15 (Đ.14) + NĐ 181/2025/NĐ-CP (Đ.26): kê khai theo quý, thuế phải nộp = đầu ra − đầu vào được khấu trừ; âm thì chuyển kỳ sau.
  // Hóa đơn đầu vào từ 5 triệu (đã gồm thuế) phải có chứng từ chuyển khoản mới được khấu trừ.
  const qOf=d=>Math.floor((+String(d).slice(5,7)-1)/3)+1,inY=i=>String(i.date||'').slice(0,4)==String(y);
  const inA=goodInv('in').filter(inY),outA=goodInv('out').filter(inY);
  const okPay=i=>Math.abs(num(i.total))<5000000||payOf(i).paid>=num(i.total)-1000||(i.meta&&i.meta.pay==='done');
  let carry=0;const rows=[],Q=[];
  for(let q=1;q<=4;q++){if(q>curQ)break;
    const O=outA.filter(i=>qOf(i.date)===q),I=inA.filter(i=>qOf(i.date)===q),bad=I.filter(i=>!okPay(i));
    const vo=sum(O,i=>num(i.vat)),vi=sum(I,i=>num(i.vat)),vbad=sum(bad,i=>num(i.vat)),vok=vi-vbad,
      net=vo-vok-carry,nxt=net<0?-net:0,pay=net>0?net:0;
    Q.push({q,O,I,vo,vi,vbad,vok,carry,pay,nxt,bad,to:sum(O,i=>num(i.total)),ti:sum(I,i=>num(i.total))});
    rows.push({c:['Quý '+q+(q===curQ?' (đang chạy)':''),vnd(sum(O,i=>num(i.total))),vnd(sum(I,i=>num(i.total))),vnd(vo),vnd(vi),'<b>'+vnd(vo-vi)+'</b>',vbad?'<span class="neg">'+vnd(vbad)+' ('+bad.length+' HĐ)</span>':'0',vnd(carry),pay?'<b class="neg">Nộp '+vnd(pay)+'</b>':'<b class="pos">Được khấu trừ '+vnd(nxt)+'</b>']});
    carry=nxt}
  window.__vq=Q;
  const c=Q[Q.length-1]||{vo:0,vok:0,carry:0,pay:0,nxt:0,O:[],I:[],bad:[],vbad:0,q:curQ};
  const gap=c.vok+c.carry-c.vo; // >0: đầu vào (được khấu trừ + dư kỳ trước) lớn hơn đầu ra
  const need=gap>0?`<div class="note">${pill('Cảnh báo VAT','bad')}<span>Quý ${c.q}/${y}: thuế đầu vào được khấu trừ${c.carry?' (cộng '+vnd(c.carry)+' đ chuyển từ quý trước)':''} lớn hơn thuế đầu ra <b>${vnd(gap)} đ</b>. Muốn không còn dư khấu trừ thì cần xuất thêm hóa đơn có thuế khoảng <b>${vnd(gap)} đ</b>, tương đương doanh thu chưa thuế khoảng <b>${vnd(gap/0.08)} đ</b> nếu thuế suất 8% hoặc <b>${vnd(gap/0.1)} đ</b> nếu 10%.</span></div>`:`<div class="note">${pill('VAT','acc')}<span>Quý ${c.q}/${y}: tạm tính phải nộp <b>${vnd(-gap)} đ</b>.</span></div>`;
  const warn=c.bad.length?`<div class="note">${pill('Chưa đủ điều kiện khấu trừ','warn')}<span>Quý ${c.q} có <b>${c.bad.length}</b> hóa đơn đầu vào từ 5 triệu chưa thấy chuyển khoản đủ trong sổ ngân hàng (thuế ${vnd(c.vbad)} đ). Theo NĐ 181/2025 thì chưa được khấu trừ, đã loại khỏi số tính. Nếu đã chuyển khoản mà chưa khớp thì chị đánh dấu "Đã thanh toán" ở hóa đơn.</span></div>`:'';
  return `<div class="card" style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px"><h3>Thuế GTGT năm ${y} (kê khai theo quý)</h3><b class="${c.pay?'neg':'pos'}">Quý ${c.q}: ${c.pay?'tạm nộp '+vnd(c.pay):'được khấu trừ chuyển kỳ sau '+vnd(c.nxt)} đ</b></div>
  <div class="tiles"><div class="card tile"><div class="l">Quý ${c.q}: thuế đầu ra (${c.O.length} HĐ)</div><div class="v">${vnd(c.vo)}</div></div><div class="card tile"><div class="l">Quý ${c.q}: thuế đầu vào khấu trừ được (${c.I.length-c.bad.length}/${c.I.length} HĐ)</div><div class="v">${vnd(c.vok)}</div></div><div class="card tile"><div class="l">Chênh lệch (ra − vào${c.carry?' − dư kỳ trước':''})</div><div class="v ${gap>0?'neg':''}">${vnd(c.vo-c.vok-c.carry)}</div></div></div>${need}${warn}
  ${rows.length?table([['Quý'],['Tiền ra (có thuế)','r'],['Tiền vào (có thuế)','r'],['Thuế ra','r'],['Thuế vào (tất cả HĐ)','r'],['Chênh lệch ra − vào','r'],['Trong đó vào chưa đủ ĐK (loại)','r'],['Dư kỳ trước','r'],['Kết quả','r']],rows):''}
  <p class="mute" style="margin:6px 0 0;font-size:12.5px">Tính theo quý, theo ngày hóa đơn, chỉ hóa đơn còn hiệu lực. Thuế phải nộp = thuế đầu ra − thuế đầu vào đủ điều kiện khấu trừ − số dư khấu trừ quý trước (Luật GTGT 48/2024/QH15 Điều 14, NĐ 181/2025/NĐ-CP Điều 26). Chưa xét hàng không được khấu trừ theo loại hàng, hóa đơn kê khai bổ sung kỳ sau, điều chỉnh; kế toán thuế cần đối chiếu khi nộp tờ khai.</p></div>`}

let payMemo={v:-1};
function payAlloc(){ // phân bổ tiền ngân hàng cho từng hóa đơn: (1) số HĐ trong nội dung, (2) đúng số còn lại / đúng tổng của 1 hóa đơn, (3) còn lại trả hóa đơn cũ trước
  if(payMemo.v===ver)return payMemo.r;const m=M(),r={};
  const byP={};goodInv().forEach(i=>{const k=i.dir+'|'+partyKey(i);(byP[k]=byP[k]||[]).push(i);r[i.id]={paid:0,tx:[]}});
  const txBy={};liveTx().forEach(t=>{const k=m.partyOf[t.id];if(!k)return;const dir=num(t.amount)>0?'out':'in';(txBy[dir+'|'+k]=txBy[dir+'|'+k]||[]).push(t)});
  const left=i=>num(i.total)-r[i.id].paid,put=(i,t,x,why)=>{r[i.id].paid+=x;r[i.id].tx.push({t,x,why})};
  Object.entries(byP).forEach(([k,invs])=>{invs.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    const txs=(txBy[k]||[]).map(t=>({t,amt:Math.abs(num(t.amount))})).sort((a,b)=>String(a.t.date).localeCompare(String(b.t.date)));
    // 0) nội dung ghi 2 số hóa đơn ("HD 4 8") và tổng đúng bằng 2 hóa đơn đó
    txs.forEach(o=>{const n=norm(tkx(o.t)||''),mm=/\b(?:hds|hd|hoa don|hoadon|so hd)\s*(?:so)?\s*[:#.]?\s*(\d{1,5}) (\d{1,5})(?!\d)/.exec(n);if(!mm)return;
      const no_=i=>String(i.no).replace(/^0+/,''),A=invs.filter(i=>no_(i)===mm[1]&&left(i)>1),B=invs.filter(i=>no_(i)===mm[2]&&left(i)>1);
      for(const x of A){const y=B.find(i=>i!==x&&Math.abs(left(x)+left(i)-o.amt)<=2);if(y){put(x,o.t,left(x),'số HĐ');put(y,o.t,left(y),'số HĐ');o.amt=0;break}}});
    // 1) có số hóa đơn trong nội dung
    txs.forEach(o=>{const hs=hdToks(tkx(o.t));if(!hs.length)return;const no_=i=>String(i.no).replace(/^0+/,''),f0=hs.length>1?invs.filter(i=>no_(i)===hs[hs.length-1]):[],f=f0.length?f0:invs.filter(i=>hs.includes(no_(i)));
      f.sort((a,b)=>Math.abs(days(a.date,o.t.date))-Math.abs(days(b.date,o.t.date)));
      if(f.length){const i=f[0],x=Math.min(o.amt,Math.max(0,left(i)));if(x>0.5){put(i,o.t,x,'số HĐ');o.amt-=x}}else{o.noSpill=true}});
    // 2) đúng số còn lại hoặc đúng tổng 1 hóa đơn
    txs.forEach(o=>{if(o.amt<=0.5)return;const c=invs.filter(i=>Math.abs(left(i)-o.amt)<=1&&left(i)>1);
      const c2=c.length?c:invs.filter(i=>Math.abs(num(i.total)-o.amt)<=1&&left(i)>1);
      if(c2.length){c2.sort((a,b)=>Math.abs(days(a.date,o.t.date))-Math.abs(days(b.date,o.t.date)));put(c2[0],o.t,o.amt,'số tiền');o.amt=0}});
    // 2a) bằng tổng của đúng 2 hóa đơn chưa trả hết (vd "HD 4 8")
    txs.forEach(o=>{if(o.amt<=0.5)return;const L=invs.filter(i=>left(i)>1);let hit=null;for(let a=0;a<L.length&&!hit;a++)for(let b=a+1;b<L.length;b++){if(Math.abs(left(L[a])+left(L[b])-o.amt)<=2){hit=[L[a],L[b]];break}}
      if(hit){hit.forEach(i=>put(i,o.t,left(i),'tổng 2 HĐ'));o.amt=0}});
    // 2b) đúng tỷ lệ phần trăm (tạm ứng 30%, 50%, 70%...) của một hóa đơn
    txs.forEach(o=>{if(o.amt<=0.5||o.noSpill)return;for(const p of [.3,.4,.5,.6,.7,.8,.9,.95,.97]){const c=invs.filter(i=>left(i)>1&&Math.abs(Math.round(num(i.total)*p)-o.amt)<=2);if(c.length){c.sort((a,b)=>Math.abs(days(a.date,o.t.date))-Math.abs(days(b.date,o.t.date)));put(c[0],o.t,o.amt,Math.round(p*100)+'%');o.amt=0;break}}});
    // 3) phần còn lại: hóa đơn cũ trước
    txs.forEach(o=>{if(o.noSpill)return;for(const i of invs){if((i.date||'')<START)continue;if(o.amt<=0.5)break;const x=Math.min(o.amt,left(i));if(x<=0.5)continue;put(i,o.t,x,'cũ trước');o.amt-=x}});
  });
  // giao dịch chưa khớp đối tác: khớp theo đúng số còn lại của một hóa đơn (không giới hạn mức tiền)
  const allI=goodInv();
  liveTx().forEach(t=>{if(m.partyOf[t.id]||!t.date||m.isInternal(t))return;const dir=num(t.amount)>0?'out':'in',amt=Math.abs(num(t.amount));if(amt<1)return;
    const c=allI.filter(i=>i.dir===dir&&i.date&&Math.abs(left(i)-amt)<=1&&left(i)>1&&days(i.date,t.date)>=-7&&days(i.date,t.date)<=180).sort((a,b)=>Math.abs(days(a.date,t.date))-Math.abs(days(b.date,t.date)));
    if(c.length===1||(c.length>1&&Math.abs(days(c[0].date,t.date))<Math.abs(days(c[1].date,t.date))-10)){put(c[0],t,amt,'số tiền')}});
  payMemo={v:ver,r};return r;
}
let debtMemo={v:-1};
function debtCalc(){ // công nợ: chỉ hóa đơn từ 1/1/2026, trừ số tiền đã phân bổ vào đúng các hóa đơn đó
  if(debtMemo.v===ver)return debtMemo;const m=M(),r=payAlloc(),by={};
  const get=k=>by[k]=by[k]||{p:{key:k,name:'',mst:'',out:0,in:0,nOut:0,nIn:0,last:''},paidIn:0,paidOut:0};
  goodInv().filter(i=>(i.date||'')>=START).forEach(i=>{const k=partyKey(i),d=get(k),p=d.p,base=m.parties[k]||{},pd=Math.max(0,(r[i.id]||{paid:0}).paid);
    if(!p.name){p.name=base.name||i.partyName||'';p.mst=base.mst||''}
    if(i.dir==='out'){p.out+=num(i.total);p.nOut++;d.paidIn+=pd}else{p.in+=num(i.total);p.nIn++;d.paidOut+=pd}
    if((i.date||'')>p.last)p.last=i.date});
  liveTx().forEach(t=>{const k=m.partyOf[t.id];if(!k||!by[k]||!m.isCo(t)||(t.date||'')<START)return;const a=num(t.amount),p=by[k].p;if(a>0&&p.out===0&&p.in>0)by[k].paidOut-=a;else if(a<0&&p.in===0&&p.out>0)by[k].paidIn-=-a});
  const L=Object.values(by);
  debtMemo={v:ver,kh:L.filter(d=>d.p.out>0).map(d=>({...d,owe:d.p.out-d.paidIn})).sort((a,b)=>b.owe-a.owe),ncc:L.filter(d=>d.p.in>0).map(d=>({...d,owe:d.p.in-d.paidOut})).sort((a,b)=>b.owe-a.owe)};return debtMemo}

function payOf(i){const a=payAlloc()[i.id]||{paid:0,tx:[]},mt=i.meta||{},adv=num(mt.adv),tot=num(i.total);
  let st=mt.pay&&mt.pay!=='auto'?mt.pay:(a.paid>=tot-1000&&tot>0?'done':a.paid>0?'part':adv>0?'adv':'none');
  return{paid:a.paid,tx:a.tx,adv,st,manual:!!(mt.pay&&mt.pay!=='auto')}}

let srcMemo={v:-1};
function srcIndex(){ // gom dòng đầu vào theo mã hàng hoặc tên gần giống (≥85% ký tự, cùng con số, cùng loại phụ kiện)
  if(srcMemo.v===ver)return srcMemo.r;const groups=[],byKey={},buckets={};
  const gOf=(x)=>{const c=conv(x);if(c.code)return byKey['C:'+c.code]||(byKey['C:'+c.code]=groups.push({key:'C:'+c.code,ins:[],outs:[]})-1);
    const cp=compact(x.name),tk=tokOf(x.name),nk=tk.filter(t=>/\d/.test(t)).sort().join(' ');if(byKey['N:'+cp+'|'+norm(x.unit)]!==undefined)return byKey['N:'+cp+'|'+norm(x.unit)];
    const b=buckets[nk]=buckets[nk]||[];for(const e of b){if(sameKind(tk,e.tk)&&dice(cp,e.cp)>=.85){byKey['N:'+cp+'|'+norm(x.unit)]=e.g;return e.g}}
    const g=groups.push({key:'N:'+cp,ins:[],outs:[]})-1;b.push({cp,tk,g});byKey['N:'+cp+'|'+norm(x.unit)]=g;return g};
  goodInv('in').forEach(i=>invLines(i).forEach((x,k)=>{if(isCostLine(i,x))return;const c=conv(x);groups[gOf(x)].ins.push({i,x,k,date:i.date||'',q:c.qty,unit:c.unit})}));
  const outMap={};goodInv('out').forEach(i=>invLines(i).forEach((x,k)=>{const c=conv(x),g=gOf(x);groups[g].outs.push({i,x,k,date:i.date||'',q:c.qty});outMap[i.id+'#'+k]=g}));
  groups.forEach(g=>{g.ins.sort((a,b)=>a.date.localeCompare(b.date));g.outs.sort((a,b)=>a.date.localeCompare(b.date)||String(a.i.no).localeCompare(String(b.i.no)))});
  srcMemo={v:ver,r:{groups,outMap}};return srcMemo.r;
}
function srcOf(i,k){ // {st:'in'|'later'|'none'|'note', last, stock}
  const x=invLines(i)[k],note=(i.lineNotes||{})[k];const R=srcIndex(),g=R.groups[R.outMap[i.id+'#'+k]];
  if(!g)return{st:'none',note};const d=i.date||'';
  const before=g.ins.filter(e=>e.date<=d),last=before[before.length-1];
  let stock=sum(before,e=>e.q);for(const o of g.outs){if(o.i.id===i.id&&o.k===k)break;if(o.date<=d)stock-=o.q}
  if(note)return{st:'note',note,last,stock};
  if(last)return{st:'in',last,stock,need:conv(x).qty};
  const later=g.ins.find(e=>e.date>d);return later?{st:'later',last:later}:{st:'none'};
}

/* --- Nạp hóa đơn từ XML (eHoadon, BKAV) và Excel danh sách (GDT) --- */
function parseInvoiceXml(text){
  const doc=new DOMParser().parseFromString(text,'text/xml');if(doc.getElementsByTagName('parsererror').length)throw new Error('File XML không hợp lệ');

  const nb=doc.getElementsByTagName('NBan')[0]||doc,nm=doc.getElementsByTagName('NMua')[0]||doc,tt=doc.getElementsByTagName('TToan')[0]||doc;
  const lines=[...doc.getElementsByTagName('HHDVu')].map(h=>({name:g(h,'THHDVu'),unit:g(h,'DVTinh'),qty:num(g(h,'SLuong')),price:num(g(h,'DGia')),amount:num(g(h,'ThTien'))})).filter(l=>l.name);
  const r={no:g(doc,'SHDon'),symbol:(g(doc,'KHMSHDon')&&g(doc,'KHHDon')&&!g(doc,'KHHDon').startsWith(g(doc,'KHMSHDon'))?g(doc,'KHMSHDon'):'')+g(doc,'KHHDon'),date:(g(doc,'NLap')||'').slice(0,10),seller:{name:g(nb,'Ten'),mst:g(nb,'MST'),address:g(nb,'DChi'),email:g(nb,'DCTDTu')},buyer:{name:g(nm,'Ten'),mst:g(nm,'MST'),address:g(nm,'DChi'),email:g(nm,'DCTDTu')},lines,net:num(g(tt,'TgTCThue')),vat:num(g(tt,'TgTThue')),total:num(g(tt,'TgTTTBSo'))};
  if(!r.no)throw new Error('Không thấy số hóa đơn trong XML');r.symbol=r.symbol.replace(/^\d(?=[A-Z])/,'');return r;
}
function parseInvSheet(aoa,dir){
  let hi=-1;for(let i=0;i<Math.min(aoa.length,25);i++){const r=(aoa[i]||[]).map(norm);if(r.filter(c=>/ky hieu|so hoa don|ngay lap|ngay hoa don|mst|ma so thue|tong tien|trang thai/.test(c)).length>=3){hi=i;break}}
  if(hi<0)throw new Error('Không thấy dòng tiêu đề (Ký hiệu, Số hóa đơn, Ngày lập…)');
  const h=aoa[hi].map(norm),f=(re,pref)=>{const ix=h.map((c,i)=>re.test(c)?i:-1).filter(i=>i>=0);if(pref){const p=ix.find(i=>pref.test(h[i]));if(p!==undefined)return p}return ix.length?ix[0]:-1};
  const side=dir==='in'?/ban/:/mua/;

  if(ci.no<0||ci.date<0)throw new Error('Thiếu cột Số hóa đơn hoặc Ngày');

    const net=ci.net>=0?moneyNum(r[ci.net]):0,vat=ci.vat>=0?moneyNum(r[ci.vat]):0,total=ci.total>=0?moneyNum(r[ci.total]):net+vat;
    out.push({no:no.replace(/^0+(?=\d)/,''),symbol:ci.sym>=0?String(r[ci.sym]).trim():'',date,mst:ci.mst>=0?String(r[ci.mst]).trim():'',partyName:ci.name>=0?String(r[ci.name]).trim():'',net,vat:vat||total-net,total,status:ci.status>=0?String(r[ci.status]).trim():''})}
  return out;

const costCfg=()=>((S.cost||{}).cfg)||{};
const kwList=s=>String(s||'').split(/[,;\n]/).map(x=>norm(x).replace(/[^a-z0-9& .]/g,' ').replace(/\s+/g,' ').trim()).filter(x=>x.length>=2);
const kwRe=s=>{const l=kwList(s);return l.length?new RegExp(' ('+l.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+') '):null};

let costMemo={v:-1};
function costRules(){if(costMemo.v===ver)return costMemo.r;const r=(costCfg().rules)||{};
  costMemo={v:ver,r:COSTCATS.map(cat=>{const c=r[cat]||COSTDEF[cat];return{cat,rn:kwRe(c.ncc),rh:kwRe(c.hang)}})};return costMemo.r}
const costKey=(name,unit)=>cvId(name,unit);
function costOf(inv,l){ // {cp, cat, why}
  if(!inv||inv.dir!=='in')return{cp:false};
  const mk=l&&S.costmark[costKey(l.name,l.unit)];
  if(mk)return mk.cp?{cp:true,cat:mk.cat||'Khác',why:'Chị đánh dấu'+(mk.note?': '+mk.note:'')}:{cp:false,why:'Chị đánh dấu là thương mại'};
  if(inv.purpose==='cp')return{cp:true,cat:inv.costCat||'Khác',why:'Cả hóa đơn là chi phí'};
  if(inv.purpose==='tm')return{cp:false,why:'Cả hóa đơn là thương mại'};
  const R=costRules(),pn=textN(inv.partyName);
  for(const r of R)if(r.rn&&r.rn.test(pn))return{cp:true,cat:r.cat,why:'Người bán khớp từ khóa'};
  if(l){const ln=textN(l.name);for(const r of R)if(r.rh&&r.rh.test(ln))return{cp:true,cat:r.cat,why:'Tên hàng khớp từ khóa'}}
  return{cp:false};
}
const isCostLine=(i,l)=>i.dir==='in'&&costOf(i,l).cp;
function invCost(i){ // phần chi phí của một hóa đơn đầu vào: {amt, cat, all}
  if(i.dir!=='in')return{amt:0};const ls=invLines(i);
  if(!ls.length){const c=costOf(i,null);return c.cp?{amt:num(i.net),cat:c.cat,all:true}:{amt:0}}
  let amt=0,cat='',n=0;ls.forEach(l=>{const c=costOf(i,l);if(c.cp){amt+=num(l.amount)||num(l.qty)*num(l.price);cat=cat||c.cat;n++}});
  return{amt,cat,all:n===ls.length,part:n>0&&n<ls.length};
}

/* ================= DANH MỤC HÀNG HÓA (tạm, gom từ hóa đơn đầu vào) ================= */
let dmMemo={v:-1};
function catalog(){
  if(dmMemo.v===ver&&dmMemo.th===(st.dmTh||'0.9'))return dmMemo.g;
  const N={};goodInv('in').forEach(i=>invLines(i).forEach(x=>{const nm=String(x.name||'').trim();if(isCostLine(i,x)){return}if(!nm||num(x.amount)===0&&num(x.price)===0&&/tang kem|khuyen mai/.test(norm(nm)))return;
    const k=norm(nm).replace(/\s+/g,' ')+'|'+norm(x.unit),r=N[k]=N[k]||{key:norm(x.name)+'|'+norm(x.unit),name:nm,unit:x.unit||'',n:0,qty:0,amt:0,last:'',lastPrice:0,minP:Infinity,maxP:0,ncc:new Set()};
    r.n++;r.qty+=num(x.qty);r.amt+=num(x.amount)||num(x.qty)*num(x.price);const p=num(x.price);if(p>0){r.minP=Math.min(r.minP,p);r.maxP=Math.max(r.maxP,p)}
    if((i.date||'')>=r.last){r.last=i.date;r.lastPrice=p}r.ncc.add(i.partyName||'')}));
  // gom theo độ giống tên: so từng cặp ký tự (bỏ dấu, khoảng trắng, ký hiệu); cùng các con số; không khác loại phụ kiện; so với tên đại diện để không nối dây chuyền
  const th=+(st.dmTh||0.9),L=Object.values(N).sort((a,b)=>b.n-a.n),T=L.map(x=>tokOf(x.name)),C=L.map(x=>compact(x.name)),G={},leaders={};
  L.forEach((x,i)=>{const nk=T[i].filter(t=>/\d/.test(t)).sort().join(' '),ls=leaders[nk]=leaders[nk]||[];let best=-1,bs=0;
    for(const j of ls){if(!sameKind(T[i],T[j]))continue;const sc=dice(C[i],C[j]);if(sc>=th&&sc>bs){bs=sc;best=j}}
    x.sim=best<0?1:bs;if(best<0){ls.push(i);G[i]=[x]}else G[best].push(x)});
  const g=Object.values(G).map(items=>{items.sort((a,b)=>b.n-a.n);const c=items.map(x=>cvOf(x.name,x.unit)).find(Boolean),it=c&&c.itemId&&S.items[c.itemId];
    return{items,main:items[0],n:sum(items,x=>x.n),amt:sum(items,x=>x.amt),units:[...new Map(items.filter(x=>x.unit).map(x=>[norm(x.unit),x.unit])).values()],ncc:[...new Set(items.flatMap(x=>[...x.ncc]).filter(Boolean))],last:items.map(x=>x.last).sort().pop()||'',code:it?it.code:'',mapped:items.filter(x=>cvOf(x.name,x.unit)).length}})
   .sort((a,b)=>b.items.length-a.items.length||b.amt-a.amt);
  dmMemo={v:ver,th:st.dmTh||'0.9',g};return g;
}

function unmapped(){const m={};goodInv().forEach(i=>invLines(i).forEach((x,k)=>{if(cvOf(x.name,x.unit)||isCostLine(i,x))return;const key=norm(x.name)+'|'+norm(x.unit),r=m[key]=m[key]||{key,name:x.name,unit:x.unit||'',n:0,qty:0,id:i.id,ln:k,dirs:new Set()};r.n++;r.qty+=num(x.qty);r.dirs.add(i.dir)}));return Object.values(m).sort((a,b)=>b.n-a.n)}
function mergeSuggest(un){ // gom các tên chưa gán có độ giống cao
  const toks=un.map(u=>tokOf(u.name)),used=new Set(),out=[];
  for(let i=0;i<un.length&&out.length<40;i++){if(used.has(i))continue;const g=[i];
    for(let j=i+1;j<un.length;j++){if(used.has(j))continue;if(simScore(toks[i],toks[j])>=.6)g.push(j)}
    if(g.length>1){g.forEach(x=>used.add(x));out.push(g.map(x=>un[x]))}}
  return out;
}

function xnt(from,to){const m={};
  goodInv().filter(i=>i.date&&i.date<=to).forEach(i=>invLines(i).forEach(x=>{if(isCostLine(i,x))return;const c=conv(x),k=(c.code?'#'+c.code:'@'+norm(c.name))+'|'+norm(c.unit);
    const r=m[k]=m[k]||{code:c.code,name:c.name,unit:c.unit,open:0,inQ:0,outQ:0,inV:0,outV:0};const s=i.dir==='in'?1:-1;
    if(i.date<from)r.open+=s*c.qty;else if(i.dir==='in'){r.inQ+=c.qty;r.inV+=c.amount}else{r.outQ+=c.qty;r.outV+=c.amount}}));
  return Object.values(m).map(r=>({...r,close:r.open+r.inQ-r.outQ})).sort((a,b)=>(a.code?0:1)-(b.code?0:1)||String(a.code).localeCompare(String(b.code))||a.name.localeCompare(b.name,'vi'))}

 body(){const [f,t]=rng(),q=norm(st.xnq||'');const l=xnt(f,t).filter(r=>(Math.abs(r.open)>1e-9||r.inQ||r.outQ)&&(!st.xnMap||r.code)&&(!q||norm(r.code+' '+r.name).includes(q)));
  const neg=l.filter(r=>r.close<-1e-6).length;
  return `<div class="note">${pill('Nguồn','acc')}<span>Nhập = chi tiết hàng trên <b>hóa đơn đầu vào</b>, Xuất = chi tiết hàng trên <b>hóa đơn đầu ra</b> (đã bỏ HĐ hủy, bị thay thế). Hàng đã gán mã được gộp theo mã và đơn vị đích. ${neg?`<b>${neg}</b> dòng tồn âm: thường do bán ra một tên chưa gán cùng mã với tên mua vào, hoặc khác đơn vị.`:''}</span></div>
  <div class="tiles"><div class="card tile"><div class="l">Mặt hàng</div><div class="v">${l.length}</div><div class="s">${l.filter(r=>r.code).length} đã có mã</div></div><div class="card tile"><div class="l">Giá trị nhập</div><div class="v">${vnd(sum(l,r=>r.inV))} đ</div></div><div class="card tile"><div class="l">Giá trị xuất (bán)</div><div class="v">${vnd(sum(l,r=>r.outV))} đ</div></div></div>`+
  table([['Mã'],['Hàng hóa','w'],['ĐVT'],['Tồn đầu','r'],['Nhập','r'],['Xuất','r'],['Tồn cuối','r'],['Giá trị nhập','r'],['Giá trị xuất','r']],l.map(r=>({cls:r.close<-1e-6?'hl':'',c:[r.code?`<b>${esc(r.code)}</b>`:'<span class="mute">—</span>',esc(r.name),esc(r.unit),qf(r.open),qf(r.inQ),qf(r.outQ),`<b class="${r.close<-1e-6?'neg':''}">${qf(r.close)}</b>`,vnd(r.inV),vnd(r.outV)]})),{empty:'Chưa có dòng hàng trên hóa đơn trong kỳ này.'})}};

function txAuto(){if(txaMemo.v===ver)return txaMemo.r;const m=M(),idx={in:{},out:{}},byParty={},all={in:[],out:[]};

  const r={};arr(S.bankTx).forEach(t=>{const dir=num(t.amount)>0?'out':'in',amt=Math.abs(num(t.amount)),pk=m.partyOf[t.id];let inv=null,why='';

const ctFromDesc=d=>{const m=/(?:^|[\s.,;])c\s?t\s+(.+?)(?:\s+-\s+|\s+ma\s+giao\s+dich|\s+trace|\s+ft\d|\s+ad\b|$)/i.exec(String(d||'').normalize('NFC'));if(!m)return '';

/* --- Nhập sao kê: bỏ qua giao dịch trùng (cùng tài khoản, ngày, số tiền) --- */
function parseStatement(aoa){
  let hi=-1;for(let i=0;i<Math.min(aoa.length,60);i++){const r=(aoa[i]||[]).map(norm);if(r.filter(c=>/ngay|date|noi dung|dien giai|mo ta|ghi no|ghi co|so tien|debit|credit|so du|rut ra|gui vao|phat sinh|tien ra|tien vao/.test(c)).length>=3){hi=i;break}}
  if(hi<0)throw new Error('Không thấy dòng tiêu đề (Ngày, Nội dung, Số tiền…) trong file');
  const h=aoa[hi].map(norm),f=re=>h.findIndex(c=>re.test(c));
  const ci={date:f(/ngay|date/),debit:f(/ghi no|debit|rut ra|tien ra|chi ra|phat sinh no|so tien no/),credit:f(/ghi co|credit|gui vao|tien vao|thu vao|phat sinh co|so tien co/),amt:f(/^so tien|amount|^gia tri/),desc:f(/noi dung|dien giai|mo ta|chi tiet|description|ghi chu/),bal:f(/so du|balance/)};
  if(ci.date<0||ci.desc<0||(ci.debit<0&&ci.credit<0&&ci.amt<0))throw new Error('Thiếu cột Ngày, Nội dung hoặc Số tiền');
  const out=[];for(let i=hi+1;i<aoa.length;i++){const r=aoa[i]||[],date=parseDate(r[ci.date]);if(!date)continue;
    let a=0;if(ci.debit>=0||ci.credit>=0)a=(ci.credit>=0?Math.abs(moneyNum(r[ci.credit])):0)-(ci.debit>=0?Math.abs(moneyNum(r[ci.debit])):0);else a=moneyNum(r[ci.amt]);
    if(!a)continue;out.push({date,amount:a,desc:String(r[ci.desc]||'').replace(/\s+/g,' ').trim(),balance:ci.bal>=0&&r[ci.bal]!==''?moneyNum(r[ci.bal]):'',seq:out.length})}
  return out;
}
function dedupeRows(accId,rows){const have={};arr(S.bankTx).forEach(t=>{if(t.accountId===accId){const k=t.date+'|'+Math.round(num(t.amount));have[k]=(have[k]||0)+1}});
  const fresh=[];let skip=0;rows.forEach(r=>{const k=r.date+'|'+Math.round(num(r.amount));if(have[k]>0){have[k]--;skip++}else fresh.push(r)});return{fresh,skip}}
async function writeTx(accId,rows,seq0){const docs=rows.map((r,i)=>{const k=txKey(accId,r.date,r.amount,r.desc,r.balance);let id=txId(k),n=1;while(S.bankTx[id])id=txId(k)+'_'+(n++);
  const d={accountId:accId,date:r.date,amount:num(r.amount),desc:String(r.desc||''),balance:r.balance===''||r.balance==null?'':num(r.balance),seq:(seq0||0)+(r.seq??i),key:k,at:new Date().toISOString()};S.bankTx[id]=d;return[id,d]});
  await pool(docs,([id,d])=>put('bankTx',id,d),4,(a,b)=>setProg(`Đang lưu giao dịch ${accName(accId)}: ${a}/${b}…`));setProg('');ver++;return docs.length}

/* ================= NHÂN SỰ: dữ liệu từ phần mềm Chấm Công Công Trình ================= */
const CCDEF={start:'08:00',end:'17:00',lunchStart:'12:00',lunchEnd:'13:00',stdHours:8,otMult:1.5,sunMult:1.5,roundMin:15,congRound:'exact'};
const CCSHIFT={A:{start:'08:00',lunchStart:'12:00',lunchEnd:'13:00',end:'17:00'},B:{start:'08:00',lunchStart:'12:00',lunchEnd:'13:30',end:'17:30'}};
const ccCfg=()=>({...CCDEF,...((S.ccMeta||{}).cfg||{})});
const toMinCC=s=>{if(!s)return null;const [h,m]=String(s).split(':').map(Number);return isNaN(h)?null:h*60+(m||0)};
const ovCC=(a,b,c,d)=>Math.max(0,Math.min(b,d)-Math.max(a,c));
const isSunCC=s=>new Date(s+'T00:00:00').getDay()===0;
const r2=n=>Math.round((n||0)*100)/100;
function ccCalc(e){ // giống hệt cách tính của phần mềm chấm công
  const cfg=ccCfg(),sun=isSunCC(e.date);
  if(e.live)return{cong:0,ot:0,sun,open:true};
  if(e.v===2||'hc' in e||'otH' in e){let cong=+e.hc||0,ot=+e.otH||0;if(sun){ot+=cong*(+cfg.stdHours||8);cong=0}return{cong:r2(cong),ot:r2(ot),sun,open:false}}
  const sh=CCSHIFT[(S.cc_projects[e.projectId]||{}).shift],c=sh?{...cfg,...sh}:cfg,i=toMinCC(e.in),o0=toMinCC(e.out);
  let cong=0,ot=0;const open=!!e.in&&!e.out;
  if(i!=null&&o0!=null){let o=o0;if(o<=i)o+=1440;
    const reg=ovCC(i,o,toMinCC(c.start),toMinCC(c.lunchStart))+ovCC(i,o,toMinCC(c.lunchEnd),toMinCC(c.end));
    let otm=ovCC(i,o,toMinCC(c.end),99999);const rd=+c.roundMin||1;otm=Math.floor(otm/rd)*rd;
    cong=reg/60/(+c.stdHours||8);if(c.congRound==='half')cong=Math.round(cong*2)/2;cong=Math.min(1,r2(cong));ot=otm/60}
  if(typeof e.congOv==='number')cong=e.congOv;if(typeof e.otOv==='number')ot=e.otOv;
  return{cong,ot,sun,open};

async function processInbox(){
  if(inboxBusy||!canWrite())return;
  const items=Object.entries(S.inbox).filter(([,d])=>d&&!d.done&&(d.kind==='inv_in'||d.kind==='inv_out'||d.kind==='inv_lines'||d.kind==='bank'||(!d.kind&&d.bankName&&Array.isArray(d.rows)))&&!(inboxType(d)==='canhan'&&!isOwner()));if(!items.length)return;

    if(d.kind==='inv_out'||d.kind==='inv_in'){const dir=d.kind==='inv_out'?'out':'in',todo=[];
      for(const r of rows){const [symbol,no,date,party,net,tot,status,pName]=r;if(BADINV({status})){skip++;continue}
        const isName=!/^\d{10}(-\d{3})?$/.test(String(party)),mst=isName?'':String(party);
        const inv={dir,no:String(no),symbol,date,partyName:pName||(isName?String(party).replace(/\s*-\s*Khách hàng không cung cấp thông tin/i,''):'MST '+mst),mst,net:num(net),vat:num(tot)-num(net),total:num(tot),vatRate:num(net)?Math.round((num(tot)-num(net))/num(net)*100):0,source:d.source||'tự động',status:status||'',by:me,createdAt:new Date().toISOString()};
        inv.key=invKey(inv);const iid=ivId(inv.key);if(S.invoices[iid]){skip++;continue}S.invoices[iid]=inv;todo.push([iid,inv])}
      await pool(todo,([iid,inv])=>put('invoices',iid,inv),4,(a,b)=>setProg(`Đang nạp hóa đơn ${dir==='out'?'đầu ra':'đầu vào'} ${a}/${b}…`));n=todo.length;
      await markSync(dir==='out'?'ehd_out':'gdt_in',dir==='out'?'Hóa đơn đầu ra':'Hóa đơn đầu vào',n,skip?skip+' bỏ qua':'');
    }else if(d.kind==='inv_lines'){const todo=[];
      for(const r of rows){const [dir,symbol,no,mst,lines]=r;const iid=ivId([dir,symbol||'',String(no),dir==='in'?String(mst||''):OURMST()].join('|')),inv=S.invoices[iid];
        if(!inv||invLines(inv).length||BADINV(inv)){skip++;continue}
        const ls=(lines||[]).map(l=>({name:String(l[0]||'').trim(),unit:String(l[1]||'').trim(),qty:num(l[2]),price:num(l[3]),amount:num(l[4])})).filter(l=>l.name);if(!ls.length){skip++;continue}
        inv.lines=ls;todo.push([iid,ls])}
      await pool(todo,([iid,ls])=>patch('invoices',iid,{lines:ls}),4,(a,b)=>setProg(`Đang nạp chi tiết hàng hóa ${a}/${b}…`));n=todo.length;
    }else{ // sao kê ngân hàng
      let a=(d.accountId&&S.bank[d.accountId])?{id:d.accountId}:findAcc(d.bankName||'',d.last4||'');
      if(!a){const nid=uid(),doc={bankName:d.bankName||'Khác',accountNo:String(d.last4||'').slice(-4),name:d.name||'',opening:0,type:d.type||'cty'};await put('bank',nid,doc);S.bank[nid]=doc;a={id:nid}}
      const rs=rows.map((r,i)=>({date:r[0],amount:num(r[1]),desc:r[2],balance:r[3],seq:(d.seq0||0)+i})).filter(r=>r.date&&r.amount);
      const {fresh,skip:sk}=dedupeRows(a.id,rs);skip=sk;n=await writeTx(a.id,fresh,0);
      await markSync('bank_'+a.id,'Sao kê '+accName(a.id),n,skip?skip+' GD trùng':'');
    }
    await put('inbox',id,{kind:d.kind||'bank',bankName:d.bankName||'',source:d.source||'',rows:[],csv:'',done:true,doneAt:new Date().toISOString(),count:n,skipped:skip});S.inbox[id].done=true;total+=n;ver++;
  }
  if(total){logAct('tự động nạp '+total+' dòng dữ liệu');toast('Đã nạp '+total+' dòng dữ liệu mới')}refresh();
  }catch(e){console.error(e);toast('Nạp dữ liệu tự động bị lỗi: '+(e.message||e.code),'bad')}
  finally{inboxBusy=false;setProg('')}
}

const txRate=i=>{let r=i.vatRate;if(r===undefined||r===null||r===''){const n=num(i.net);r=n?Math.round(num(i.vat)/n*100):0}r=num(r);return [0,5,8,10].includes(r)?r:(Math.abs(r-8)<1.5?8:Math.abs(r-10)<1.5?10:Math.abs(r-5)<1.5?5:r)};

function txCalc(y,q,all){
  const qOf=d=>Math.floor((+String(d).slice(5,7)-1)/3)+1,yOf=d=>+String(d).slice(0,4);
  const O0=goodInv('out').filter(i=>yOf(i.date)===y),I0=goodInv('in').filter(i=>yOf(i.date)===y);
  let carry=txOpen(),R=null;
  for(let k=1;k<=q;k++){
    const O=O0.filter(i=>qOf(i.date)===k),I=I0.filter(i=>qOf(i.date)===k);
    const Ig=all?I:I.filter(txOk),Ib=all?[]:I.filter(i=>!txOk(i));
    const by=r=>O.filter(i=>txRate(i)===r),nt=O.filter(i=>![0,5,8,10].includes(txRate(i))||(txRate(i)===0));
    const v={n0:sum(by(0),i=>i.net),n5:sum(by(5),i=>i.net),t5:sum(by(5),i=>i.vat),n8:sum(by(8),i=>i.net),t8:sum(by(8),i=>i.vat),n10:sum(by(10),i=>i.net),t10:sum(by(10),i=>i.vat)};
    const c26=sum(O.filter(i=>txRate(i)===0),i=>i.net),other=O.filter(i=>![0,5,8,10].includes(txRate(i)));
    const c23=sum(I,i=>i.net),c24=sum(I,i=>i.vat),c25=sum(Ig,i=>i.vat);
    const c27=v.n5+v.n8+v.n10+sum(other,i=>i.net),c28=v.t5+v.t8+v.t10+sum(other,i=>i.vat),c34=c26+c27,c36=c28-c25;
    const x=carry*-1+c36;               // [36]-[22]
    const c40=x>0?x:0,c41=x<0?-x:0;
    R={y,q:k,O,I,Ig,Ib,v,c22:carry,c23,c24,c25,c26,c27,c28,c34,c36,c40,c41,c43:c41,other,vbad:sum(Ib,i=>i.vat)};

function docTien(n){n=Math.round(n||0);if(!n)return 'Không đồng';const neg=n<0;n=Math.abs(n);const ch=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
  const ba=(x,full)=>{let s='';const tr=Math.floor(x/100),c=Math.floor(x%100/10),d=x%10;if(full||tr>0)s+=ch[tr]+' trăm ';
    if(c>1){s+=ch[c]+' mươi ';if(d===1)s+='mốt ';else if(d===5)s+='lăm ';else if(d>0)s+=ch[d]+' '}else if(c===1){s+='mười ';if(d===5)s+='lăm ';else if(d>0)s+=ch[d]+' '}else if(d>0){if(full||tr>0)s+='lẻ ';s+=ch[d]+' '}return s};
  const un=['','nghìn','triệu','tỷ','nghìn tỷ'],g=[];while(n>0){g.push(n%1000);n=Math.floor(n/1000)}let out='';for(let i=g.length-1;i>=0;i--){if(!g[i])continue;out+=ba(g[i],i<g.length-1)+un[i]+' '}
  out=out.replace(/\s+/g,' ').trim();return (neg?'Âm ':'')+out.charAt(0).toUpperCase()+out.slice(1)+' đồng'}

  const m=$('#main'),y=m?m.scrollTop:0,ae=document.activeElement,bound=ae&&ae.dataset&&ae.dataset.bind;
  const tw=$$('.tw',b).map(x=>[x.scrollTop,x.scrollLeft]);
  render();if(m)m.scrollTop=y;$$('.tw',$('#body')).forEach((x,i)=>{if(tw[i]){x.scrollTop=tw[i][0];x.scrollLeft=tw[i][1]}});
  if(bound){const e=$(`[data-bind="${bound}"]`);if(e){e.focus();if(e.setSelectionRange&&e.type==='search')e.setSelectionRange(e.value.length,e.value.length)}}},250)}
function go(v){view=v;render();const m=$('#main');if(m)m.scrollTop=0}
A.go=d=>{closeModal();go(d.id)};A.close=closeModal;
A.reqRole=async()=>{try{await put('requests',me,{at:new Date().toISOString(),want:'ketoan'});toast('Đã gửi đề nghị, chờ chị Huyền Thi cấp quyền')}catch(e){toast('Không gửi được. Bạn cần được mời với quyền Contributor.','bad')}};
document.addEventListener('click',e=>{if(e.target.closest('.ie'))return;const t=e.target.closest('[data-act]');if(!t)return;const f=A[t.dataset.act];if(f){e.preventDefault();e.stopPropagation();f(t.dataset,t)}});
let bt=null;
function bindUpdate(e){const k=e.target.dataset&&e.target.dataset.bind;if(!k)return;st[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;
  clearTimeout(bt);bt=setTimeout(()=>{const b=$('#body');if(b)try{b.innerHTML=VIEWS[view].body()}catch(err){console.error(err)}},e.type==='input'?220:0)}
document.addEventListener('input',e=>{if(e.target.type==='checkbox'||e.target.tagName==='SELECT'||e.target.type==='date')return;bindUpdate(e)});
document.addEventListener('change',e=>{if(e.target.type==='checkbox'||e.target.tagName==='SELECT'||e.target.type==='date'){bindUpdate(e);if(e.target.dataset.bind==='ba')setTimeout(()=>{$('#bar').innerHTML=VIEWS[view].bar()},10)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
async function loadNames(){if(!usr||!usr.profiles)return;
  const ids=[...new Set([me,...Object.keys(S.users),...Object.keys(S.requests),...Object.values(S.log).map(l=>l.uid)].filter(Boolean))].filter(i=>!(i in names));if(!ids.length)return;
  ids.forEach(i=>names[i]='');try{const ps=await usr.profiles(ids);ids.forEach(i=>{const n=ps&&ps[i]&&ps[i].name;if(n)names[i]=n});refresh()}catch(e){}}

/* ================= Phân quyền và khởi động ================= */
function gate(){
  const isAdmin=usr&&(usr.canEdit()||usr.isOwner()),u=S.users[me];
  role=isAdmin?'admin':(u&&u.role==='ketoan'?'ketoan':'xem');
  render();loadNames();autoOnLoad();
}
(async function boot(){
  const root=$('#root');
  try{
    db=await claude.use('db');usr=await claude.use('user');dl=await claude.use('downloads');
    if(!db||!usr){root.innerHTML='<div class="center"><h1>Quản lý bán hàng Thi Đạt</h1><p class="mute">Hãy mở phần mềm trong Claude và đăng nhập bằng tài khoản đã được chia sẻ.</p></div>';return}
    me=await usr.id();if(!me){root.innerHTML='<div class="center"><p class="mute">Không xác định được tài khoản. Hãy đăng nhập Claude rồi tải lại trang.</p></div>';return}
    const keys=[...COLS,'settings','status','req','pbank','pbankTx'];let pending=keys.length,started=false;
    const done=()=>{if(--pending===0&&!started){started=true;gate()}};
    COLS.forEach(c=>{let first=true;db.collection(c).onSnapshot(snap=>{snap.docChanges().forEach(ch=>{if(ch.type==='removed'){if(!(PERS[c]&&PERS[c].has(ch.doc.id)))delete S[c][ch.doc.id]}else S[c][ch.doc.id]=ch.doc.data()});ver++;if(first){first=false;done()}else refresh()},err=>{console.error(c,err);if(first){first=false;done()}})});
    [['pbank','bank'],['pbankTx','bankTx']].forEach(([pc,c])=>{let first=true;db.collection(pc).onSnapshot(snap=>{snap.docChanges().forEach(ch=>{if(ch.type==='removed'){PERS[c].delete(ch.doc.id);delete S[c][ch.doc.id]}else{PERS[c].add(ch.doc.id);S[c][ch.doc.id]=ch.doc.data()}});ver++;if(first){first=false;done()}else refresh()},()=>{if(first){first=false;done()}})});
    let f1=true,f2=true,f3=true;
    db.doc('settings/main').onSnapshot(s=>{S.settings=s.exists?s.data():{};ver++;if(f1){f1=false;done()}else refresh()},()=>{if(f1){f1=false;done()}});
    db.doc('sync/status').onSnapshot(s=>{S.sync=s.exists?s.data():{};if(f2){f2=false;done()}else refresh()},()=>{if(f2){f2=false;done()}});
    db.doc('cc_meta/sync').onSnapshot(s=>{S.ccMeta=s.exists?s.data():{};ver++;refresh()},()=>{});
    db.doc('sync/request').onSnapshot(s=>{S.syncReq=s.exists?s.data():null;if(f3){f3=false;done()}else refresh()},()=>{if(f3){f3=false;done()}});
    db.collection('log').orderBy('at','desc').limit(80).onSnapshot(snap=>{S.log={};snap.docs.forEach(d=>S.log[d.id]=d.data());refresh()},()=>{});
    setTimeout(()=>{if(!started){started=true;gate();toast('Một phần dữ liệu chưa tải xong, có thể chưa đầy đủ','bad')}},10000);
  }catch(e){console.error(e);root.innerHTML='<div class="center"><p class="neg">Không khởi động được phần mềm: '+esc(e.message||e.code||'lỗi')+'</p></div>'}
})();



A.auditSum=async()=>{const m=M(),r=payAlloc(),byTx={};
  goodInv().forEach(i=>{(r[i.id]?r[i.id].tx:[]).forEach(o=>{byTx[o.t.id]=1})});
  const mk=(L,dir)=>L.filter(x=>x.owe>1000).slice(0,14).map(x=>{const k=x.p.key,invs=goodInv(dir).filter(i=>partyKey(i)===k),un=invs.filter(i=>payOf(i).paid<num(i.total)-1000).map(i=>[i.no,Math.round(num(i.total)),Math.round(payOf(i).paid),i.date]).slice(0,8),
    txs=liveTx().filter(t=>m.partyOf[t.id]===k&&m.isCo(t)&&(num(t.amount)>0)===(dir==='out')&&!byTx[t.id]).map(t=>[t.date,Math.round(num(t.amount)),String(t.desc||'').slice(0,45)]).slice(0,6);
    return{n:String(x.p.name||'').slice(0,30),tot:Math.round(dir==='out'?x.p.out:x.p.in),paid:Math.round(dir==='out'?x.paidIn:x.paidOut),owe:Math.round(x.owe),un,txNoInv:txs}});

  await db.doc('settings/audit_sum').set({np,kh:mk(m.kh,'out'),ncc:mk(m.ncc,'in').slice(0,10),fn:(()=>{const o={};try{const R=finCalc(2026,today());['rev','purch','purchGoods','invEst','expInv','cogs','gp','finRev','finExp','qlnd','pbt','cit','np','cash','bankEnd','bankOpen','ar','ap','taxPay','vatPay','vatDed','loan','loanCalc','arAuto','apAuto','loanIn','loanOut','cusIn','supOut','wageT','intT','taxT','A','L','E','diff','dCash','kd','tc'].forEach(k=>o[k]=Math.round(R[k]));o.c07=Math.round(R.B3.c07);const sv=st.fnt;['ov','tndn','b01','b02','b03','b09','nhap'].forEach(t=>{st.fnt=t;try{o['v_'+t]=VIEWS.fin.body().length}catch(e){o['v_'+t]='ERR '+e.message}});st.fnt=sv;try{o.h1=finHtml('b01',R).length;o.h2=finHtml('b02',R).length;o.h3=finHtml('b03',R).length;o.h9=finHtml('b09',R).length}catch(e){o.eh=e.message}}catch(e){o.err=e.message+' '+(e.stack||'').slice(0,200)}return o})(),tx:(()=>{const o={};try{for(const q of [1,2,3,4]){const R=txCalc(2026,q,true);o['q'+q]=[R.c22,R.c23,R.c24,R.c25,R.c26,R.c27,R.c28,R.c36,R.c40,R.c41,R.c43,Math.round(R.v.n8),Math.round(R.v.n10),R.other.length]}const sv=st.txt;['tk','ra','vao'].forEach(t=>{st.txt=t;try{o[t]=VIEWS.tax.body().length}catch(e){o[t]='ERR '+e.message}});st.txt=sv;try{o.bar=VIEWS.tax.bar().length;o.html=txHtml(txCalc(2026,3,false)).length}catch(e){o.e2=e.message}}catch(e){o.err=e.message}return o})(),vat:(()=>{try{vatCard()}catch(e){}return (window.__vq||[]).map(x=>[x.q,x.O.length,x.I.length,Math.round(x.vo),Math.round(x.vi),Math.round(x.vbad),Math.round(x.pay),Math.round(x.nxt),Math.round(x.carry)])})(),tk:[TK===undefined?-2:TK?TK.length:-1,Object.keys(tkBy).length,0,Object.keys(tkMap||{}).length],at:new Date().toISOString()})};
setInterval(async()=>{try{if(!db||!canWrite())return;const d=await db.doc('settings/audit_req').get();if(d&&d.exists){await db.doc('settings/audit_req').delete();await A.auditSum()}}catch(e){try{await db.doc('settings/audit_err').set({msg:String(e&&e.message||e),at:new Date().toISOString()})}catch(_){}}},15000);
