<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quản Lý Bán Hàng Thi Đạt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f8;--panel:#fff;--ink:#14212b;--mute:#62717c;--line:#e2e7ec;--soft:#f7f9fb;
  --navy:#0f2742;--navy2:#16365a;--gold:#e0b04f;--gold-ink:#2b1e00;--gold-soft:#fbf1dc;
  --accent:#16365a;--accent-soft:#e6edf6;
  --good:#1b7f4b;--good-soft:#dff3e7;--warn:#9a5d00;--warn-soft:#fcefd4;--bad:#b3261e;--bad-soft:#fbe3e1;
  --sh:0 1px 2px rgba(15,39,66,.05),0 6px 18px rgba(15,39,66,.06);
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c141c;--panel:#131f2a;--ink:#e5ecf2;--mute:#94a5b2;--line:#233340;--soft:#18252f;
  --accent:#8fb4e0;--accent-soft:#1b2c3d;--gold-soft:#3a2f17;
  --good:#5bc98f;--good-soft:#163527;--warn:#e7b04c;--warn-soft:#3a2e12;--bad:#f08178;--bad-soft:#3d1c1a;
  --sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c141c;--panel:#131f2a;--ink:#e5ecf2;--mute:#94a5b2;--line:#233340;--soft:#18252f;
  --accent:#8fb4e0;--accent-soft:#1b2c3d;--gold-soft:#3a2f17;
  --good:#5bc98f;--good-soft:#163527;--warn:#e7b04c;--warn-soft:#3a2e12;--bad:#f08178;--bad-soft:#3d1c1a;
  --sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--font);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
h3{font-size:15px}
.app{display:grid;grid-template-columns:236px 1fr;height:100%}
.side{background:linear-gradient(180deg,var(--navy),var(--navy2));color:#d3dfeb;display:flex;flex-direction:column;overflow-y:auto}
.brand{padding:22px 20px 12px;color:#fff;font-weight:700;font-size:17px}
.brand:before{content:'';display:block;width:34px;height:3px;background:var(--gold);border-radius:2px;margin-bottom:10px}
.brand small{display:block;font-weight:500;color:#9fb6cc;font-size:12px}
.nav{display:flex;flex-direction:column;gap:1px;padding:4px 12px 14px}

.me b{display:block;color:#fff;font-size:13px}
.main{overflow-y:auto;padding:24px 30px 70px;min-width:0}

.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}

.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
input,select,textarea{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 10px;min-width:0;width:100%}
.bar input,.bar select{width:auto}
.bar input[type=search]{min-width:200px}
textarea{min-height:64px;resize:vertical}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--sh)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.tile{position:relative;overflow:hidden;padding:14px 16px 14px 20px}
.tile:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold)}
.tile.click{cursor:pointer}.tile.click:hover{border-color:var(--gold)}
.tile .l{color:var(--mute);font-size:12.5px;font-weight:500}
.tile .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;letter-spacing:-.01em}
.tile .s{font-size:12px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tw{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--sh);-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
thead th{position:sticky;top:0;z-index:2;background:var(--panel);color:var(--mute);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;border-bottom:2px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tbody tr:nth-child(even) td{background:var(--soft)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--accent-soft)}
tbody tr.dim td{opacity:.5}
tbody tr.hl td{background:var(--warn-soft)}
.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.nw{white-space:nowrap}
.hdact{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}.hdact .when{font-size:12.5px;color:var(--mute);text-align:right;line-height:1.35}.btn.upd{font-size:15px;padding:9px 18px;box-shadow:0 2px 8px rgba(224,176,79,.45)}
@media (max-width:820px){.hdact{width:100%;justify-content:space-between}.hdact .when{text-align:left}}
.ie{padding:4px 7px;font-size:13px;border-radius:7px;min-width:110px;width:100%;margin:2px 0}textarea.ie{min-height:38px;min-width:170px}select.ie{width:auto;max-width:190px}.ie.saved{border-color:var(--good);box-shadow:0 0 0 2px var(--good-soft)}
td.w{min-width:230px}td.w2{min-width:300px}
.pill{display:inline-block;border-radius:10px;padding:0 9px;font-size:12px;line-height:20px;font-weight:600;background:var(--soft);color:var(--mute);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.gold{background:var(--gold-soft);color:var(--warn)}
.mute{color:var(--mute)}.neg{color:var(--bad)}.pos{color:var(--good)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:6px 15px;border-radius:16px;border:1px solid var(--line);background:var(--panel);font-weight:600;color:var(--mute)}
.tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tabs button:focus-visible{outline:2px solid var(--gold)}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);margin-bottom:12px;font-size:13.5px}
.row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.empty{padding:30px 16px;text-align:center;color:var(--mute)}
.ov{position:fixed;inset:0;background:rgba(8,18,28,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto;z-index:20}
.dlg{background:var(--panel);border-radius:16px;width:100%;max-width:560px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dlg.wide{max-width:1000px}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dh h2{font-size:16px}
.db{padding:16px 18px}
.df{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:3px}
.f>span{font-size:12px;color:var(--mute);font-weight:500}
.f.full{grid-column:1/-1}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;z-index:40;max-width:90vw}
.toast.bad{background:var(--bad);color:#fff}
.prog{position:sticky;top:-24px;z-index:6;margin:-6px 0 12px;background:var(--gold-soft);color:var(--warn);border:1px solid var(--gold);border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px}
.hero{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;border-radius:16px;padding:18px 22px;margin-bottom:14px;box-shadow:var(--sh)}
.hero .hi{font-size:19px;font-weight:700}.hero .sub{color:#a9bfd4;font-size:13px;text-transform:capitalize}
.chip{all:unset;cursor:pointer;background:rgba(255,255,255,.12);color:#fff;border-radius:20px;padding:6px 14px;font-size:13px}
.chip b{font-size:15px;margin-right:3px}.chip:hover{background:rgba(255,255,255,.2)}
.chip.hot{background:var(--gold);color:var(--gold-ink)}
.grpcard{margin-bottom:12px}
.center{max-width:480px;margin:12vh auto;text-align:center;padding:0 16px}
code{font-size:12px;background:var(--soft);padding:1px 5px;border-radius:5px}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mute)}.chk input{width:auto}
/* iPad và màn hình hẹp: bảng cuộn ngang, chữ tự xuống dòng */
@media (max-width:1180px){
  .app{grid-template-columns:200px 1fr}
  .main{padding:18px 16px 70px}
  .tw table{min-width:980px}
  td{white-space:normal;overflow-wrap:break-word;word-break:normal;font-size:13px;padding:7px 9px;min-width:64px}
  td:first-child{min-width:0}
  .tile .v{font-size:18px}
  th{padding:7px 9px}
  td.r{white-space:nowrap}
  .nav button{font-size:13.5px;padding:7px 10px}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{flex-direction:row;overflow-x:auto;overflow-y:hidden;align-items:center;position:sticky;top:0;z-index:8}
  .brand{padding:8px 14px;white-space:nowrap;font-size:15px}.brand:before,.brand small{display:none}
  .nav{flex-direction:row;padding:6px}.nav .grp{display:none}
  .nav button{white-space:nowrap;padding:7px 12px}
  .nav button.on{box-shadow:inset 0 -3px 0 var(--gold)}
  .me{display:none}
  .main{padding:14px 12px 70px}.head h1{font-size:19px}
  .tile .v{font-size:18px}.hero{padding:14px 16px}
  .bar input[type=search]{min-width:0;flex:1 1 100%}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .tile{padding:10px 12px 10px 16px}
}
@media print{.side,.bar,.btn{display:none}.tw{max-height:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<div id="root"><div class="center mute">Đang tải dữ liệu…</div></div>
<div id="layer"></div>
<script>
'use strict';
/* ================= Tiện ích ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=typeof v==='number'?v:parseFloat(String(v??'').replace(/[^\d.\-]/g,''));return isFinite(n)?n:0};
const vnd=n=>new Intl.NumberFormat('vi-VN',{maximumFractionDigits:0}).format(Math.round(n||0));
const qf=n=>new Intl.NumberFormat('vi-VN',{maximumFractionDigits:3}).format(+(n||0));
const p2=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const today=()=>dstr(new Date());
const dmy=iso=>iso?String(iso).slice(0,10).split('-').reverse().join('/'):'';
const days=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().trim();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const arr=o=>Object.entries(o||{}).map(([id,d])=>({id,...d}));
const sum=(a,f)=>a.reduce((s,x)=>s+num(f(x)),0);
const digits=s=>String(s||'').replace(/\D/g,'');
function h32(s,k){let h=k?0:5381;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h=k?((c+(h<<6)+(h<<16)-h)>>>0):(((h<<5)+h+c)>>>0)}return h.toString(36)}
const ivId=k=>'iv'+h32(k,0)+h32(k,1);
const txKey=(acc,date,amount,desc,bal)=>[acc,date,Math.round(num(amount)),norm(desc).replace(/\s+/g,' ').slice(0,60),bal===undefined||bal===''||bal===null?'':Math.round(num(bal))].join('|');
const txId=k=>'bt'+h32(k,0)+h32(k,1);
const START='2026-01-01';
const COMPANY={name:'Công ty TNHH Thi Đạt',mst:'0312510655'};
const OURMST=()=>digits((S.settings.company||{}).mst||COMPANY.mst);

/* ================= Trạng thái ================= */
const COLS=['bank','bankTx','invoices','items','convs','inbox','users','requests','partners','quotes','contracts','cc_emps','cc_projects','cc_ts','cost','costmark'];
const S={settings:{},sync:{},syncReq:null,log:{}};COLS.forEach(c=>S[c]={});
const PERS={bank:new Set(),bankTx:new Set()}; // tài khoản/giao dịch cá nhân nằm ở vùng riêng chỉ chủ xem được
const isOwner=()=>!!(usr&&usr.isOwner&&usr.isOwner());
const persOf=(c,id,d)=>{if(c==='bank'){if(PERS.bank.has(id))return true;if(S.bank[id])return false;return !!d&&d.type==='canhan'}
  if(c==='bankTx'){const a=(d&&d.accountId)||(S.bankTx[id]||{}).accountId;return !!a&&((S.bank[a]||{}).type==='canhan')}return false};
const colOf=(c,id,d)=>persOf(c,id,d)?(c==='bank'?'pbank':'pbankTx'):c;
let db=null,usr=null,dl=null,me=null,role=null,ver=0,view='dash',names={};
const st={}; // bộ lọc theo màn hình
const VIEWS={},A={};
const canWrite=()=>role==='admin'||role==='ketoan';
const ROLES={admin:'Quản trị',ketoan:'Kế toán',xem:'Chỉ xem'};

/* ================= Ghi dữ liệu ================= */
async function retry(f){for(let a=0;;a++){try{return await f()}catch(e){if(e&&(e.code==='resource_exhausted'||e.code==='unavailable')&&a<6){await sleep(700*(a+1)+Math.random()*500);continue}throw e}}}
const put=(c,id,d)=>{const pc=colOf(c,id,d);if(pc!==c)PERS[c].add(id);return retry(()=>db.doc(pc+'/'+id).set(d))};
const patch=(c,id,d)=>retry(()=>db.doc(colOf(c,id,d)+'/'+id).update(d));
const del=(c,id)=>retry(()=>db.doc(colOf(c,id)+'/'+id).delete());
async function pool(items,fn,n,onProg){let i=0,done=0;const w=async()=>{while(i<items.length){const k=i++;await fn(items[k]);done++;if(onProg&&(done%10===0||done===items.length))onProg(done,items.length)}};await Promise.all(Array.from({length:Math.min(n||4,items.length||1)},w))}
async function logAct(text){try{await db.collection('log').add({at:new Date().toISOString(),uid:me,text})}catch(e){}}
function nextCode(col,prefix,len){let m=0;for(const d of Object.values(S[col])){const mm=String(d.code||'').match(/(\d+)$/);if(mm&&String(d.code).startsWith(prefix)&&+mm[1]>m)m=+mm[1]}return prefix+String(m+1).padStart(len,'0')}

/* ================= Giao diện chung ================= */
function toast(msg,kind){const t=document.createElement('div');t.className='toast '+(kind||'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),kind==='bad'?5500:2800)}
const pill=(t,k)=>`<span class="pill ${k||''}">${esc(t)}</span>`;
function table(heads,rows,opt={}){
  if(!rows.length)return `<div class="tw"><div class="empty">${opt.empty||'Chưa có dữ liệu.'}</div></div>`;
  const lim=opt.limit||800,more=rows.length>lim;
  return `<div class="tw"><table><thead><tr>${heads.map(h=>`<th class="${h[1]||''}">${h[0]}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,lim).map(r=>`<tr class="${[r.act?'click':'',r.cls||''].join(' ')}" ${r.act?`data-act="${r.act}" data-id="${esc(r.id)}"`:''}>${r.c.map((x,i)=>`<td class="${heads[i][1]||''}">${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${more?`<p class="mute">Đang hiện ${lim} trên ${rows.length} dòng. Thu hẹp ngày hoặc gõ tìm kiếm để xem thêm.</p>`:''}`;
}
const F=(id,label,val='',o={})=>`<label class="f ${o.cls||''}"><span>${label}</span>${
  o.type==='select'?`<select id="${id}">${o.opts.map(([v,t])=>`<option value="${esc(v)}"${String(v)===String(val)?' selected':''}>${esc(t)}</option>`).join('')}</select>`
  :o.type==='area'?`<textarea id="${id}">${esc(val)}</textarea>`
  :`<input id="${id}" type="${o.type||'text'}" value="${esc(val)}" ${o.attr||''}>`}</label>`;
const V=id=>{const e=$('#'+id,$('#layer'));return e?e.value.trim():''};
let modalClose=null;
function modal({title,body,ok='Lưu',onOk,wide,extra=''}){
  closeModal();const l=$('#layer');
  l.innerHTML=`<div class="ov"><div class="dlg ${wide?'wide':''}" role="dialog" aria-modal="true"><div class="dh"><h2>${title}</h2><button class="btn sm" data-act="close">Đóng</button></div><div class="db">${body}</div>${onOk||extra?`<div class="df">${extra}${onOk?`<button class="btn pri" id="okbtn">${ok}</button>`:''}</div>`:''}</div></div>`;
  const b=$('#okbtn');if(b)b.onclick=async()=>{b.disabled=true;try{const r=await onOk();if(r!==false)closeModal()}catch(e){console.error(e);toast('Lỗi: '+(e&&e.message||'không lưu được'),'bad')}finally{b.disabled=false}};
}
function closeModal(){$('#layer').innerHTML='';if(modalClose)modalClose();modalClose=null}
function confirmBox(text,yes='Đồng ý'){return new Promise(res=>{const d=document.createElement('div');d.className='ov';d.style.zIndex=30;
  d.innerHTML=`<div class="dlg"><div class="db">${text}</div><div class="df"><button class="btn" id="cn">Hủy</button><button class="btn pri" id="cy">${yes}</button></div></div>`;

  const plist=Object.values(P).map(p=>({p,mst:digits(p.mst),core:norm(p.name).replace(/[^a-z0-9 ]/g,' ').replace(STOP,' ').replace(/\s+/g,'')})).filter(x=>x.mst.length>=9||x.core.length>=6);
  const invNo={in:[],out:[]};goodInv().forEach(i=>{const n=String(i.no||'').replace(/^0+/,'');if(n.length>=3)invNo[i.dir].push({n,k:partyKey(i)})});

    if(t.party!==undefined&&t.party!==''){m.partyOf[t.id]=t.party==='-'?'':t.party;return}
    const ds=norm(t.desc).replace(/[^a-z0-9]/g,''),wantOut=num(t.amount)>0;let best='',bs=0;
    for(const x of plist){if(wantOut?!x.p.nOut:!x.p.nIn)continue;let s=0;
      if(x.mst.length>=9&&ds.includes(x.mst))s=100;else if(x.core.length>=6&&ds.includes(x.core.slice(0,16)))s=x.core.length;
      if(s>bs){bs=s;best=x.p.key}}
    if(!best){const l=invNo[wantOut?'out':'in'];const hd=/(?:hd|hoadon|sohd|inv)0*(\d{3,})/.exec(ds);if(hd){const f=l.find(z=>z.n===hd[1]);if(f)best=f.k}}

const DUPMIN=200000;
const hdTok=d=>{const m=/\b(?:hd|hoa don|hoadon|so hd|inv)\s*(?:so)?\s*[:#.]?\s*0*(\d{3,})/.exec(norm(d));return m?m[1]:''};

function dupGroups(m){
  const by={};arr(S.bankTx).filter(t=>num(t.amount)<=-DUPMIN).forEach(t=>{const k=Math.round(-num(t.amount));(by[k]=by[k]||[]).push(t)});
  const out=[];
  Object.entries(by).forEach(([amt,l])=>{if(l.length<2)return;l.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    const par=l.map((_,i)=>i),f=i=>par[i]===i?i:(par[i]=f(par[i]));const why={};
    for(let i=0;i<l.length;i++)for(let j=i+1;j<l.length;j++){const a=l[i],b=l[j];if(days(a.date,b.date)>3)break;
      const ha=hdTok(a.desc),hb=hdTok(b.desc),pa=m.partyOf[a.id],pb=m.partyOf[b.id],ca=descCore(a.desc),cb=descCore(b.desc);
      let w='';if(ha&&hb&&ha!==hb)continue;if(ha&&ha===hb)w='cùng số hóa đơn '+ha;else if(pa&&pa===pb)w='cùng đối tác';else if(ca.length>=8&&ca.slice(0,24)===cb.slice(0,24))w='cùng người nhận';
      if(w){const r=f(j);par[f(i)]=r;why[r]=w}}
    const g={};l.forEach((t,i)=>{(g[f(i)]=g[f(i)]||[]).push(t)});
    Object.entries(g).filter(([,x])=>x.length>1).forEach(([r,x])=>out.push({amt:+amt,items:x,why:why[f(+r)]||why[r]||'cùng số tiền',date:x[0].date}))});
  return out.sort((a,b)=>b.date.localeCompare(a.date));
}

let payMemo={v:-1};
function payAlloc(){ // phân bổ tiền ngân hàng đã khớp đối tác cho từng hóa đơn: ưu tiên số HĐ trong nội dung, còn lại trả hóa đơn cũ trước
  if(payMemo.v===ver)return payMemo.r;const m=M(),r={};
  const byP={};goodInv().forEach(i=>{const k=i.dir+'|'+partyKey(i);(byP[k]=byP[k]||[]).push(i);r[i.id]={paid:0,tx:[]}});
  const txBy={};liveTx().forEach(t=>{const k=m.partyOf[t.id];if(!k)return;const dir=num(t.amount)>0?'out':'in';(txBy[dir+'|'+k]=txBy[dir+'|'+k]||[]).push(t)});
  Object.entries(byP).forEach(([k,invs])=>{invs.sort((a,b)=>String(a.date).localeCompare(String(b.date)));const txs=(txBy[k]||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    const left=i=>num(i.total)-r[i.id].paid;
    txs.forEach(t=>{let amt=Math.abs(num(t.amount));const h=hdTok(t.desc);
      if(h){const f=invs.find(i=>String(i.no).replace(/^0+/,'')===h);if(f){const x=Math.min(amt,Math.max(0,left(f)))||amt;r[f.id].paid+=x;r[f.id].tx.push({t,x});amt-=x}}
      for(const i of invs){if(amt<=0.5)break;const x=Math.min(amt,left(i));if(x<=0.5)continue;r[i.id].paid+=x;r[i.id].tx.push({t,x});amt-=x}});});
  payMemo={v:ver,r};return r;
}

/* --- Nạp hóa đơn từ XML (eHoadon, BKAV) và Excel danh sách (GDT) --- */
function parseInvoiceXml(text){
  const doc=new DOMParser().parseFromString(text,'text/xml');if(doc.getElementsByTagName('parsererror').length)throw new Error('File XML không hợp lệ');
  const g=(r,t)=>{const e=r.getElementsByTagName(t)[0];return e?e.textContent.trim():''};
  const nb=doc.getElementsByTagName('NBan')[0]||doc,nm=doc.getElementsByTagName('NMua')[0]||doc,tt=doc.getElementsByTagName('TToan')[0]||doc;
  const lines=[...doc.getElementsByTagName('HHDVu')].map(h=>({name:g(h,'THHDVu'),unit:g(h,'DVTinh'),qty:num(g(h,'SLuong')),price:num(g(h,'DGia')),amount:num(g(h,'ThTien'))})).filter(l=>l.name);
  const r={no:g(doc,'SHDon'),symbol:(g(doc,'KHMSHDon')&&g(doc,'KHHDon')&&!g(doc,'KHHDon').startsWith(g(doc,'KHMSHDon'))?g(doc,'KHMSHDon'):'')+g(doc,'KHHDon'),date:(g(doc,'NLap')||'').slice(0,10),seller:{name:g(nb,'Ten'),mst:g(nb,'MST')},buyer:{name:g(nm,'Ten'),mst:g(nm,'MST')},lines,net:num(g(tt,'TgTCThue')),vat:num(g(tt,'TgTThue')),total:num(g(tt,'TgTTTBSo'))};
  if(!r.no)throw new Error('Không thấy số hóa đơn trong XML');r.symbol=r.symbol.replace(/^\d(?=[A-Z])/,'');return r;
}
function parseInvSheet(aoa,dir){
  let hi=-1;for(let i=0;i<Math.min(aoa.length,25);i++){const r=(aoa[i]||[]).map(norm);if(r.filter(c=>/ky hieu|so hoa don|ngay lap|ngay hoa don|mst|ma so thue|tong tien|trang thai/.test(c)).length>=3){hi=i;break}}
  if(hi<0)throw new Error('Không thấy dòng tiêu đề (Ký hiệu, Số hóa đơn, Ngày lập…)');
  const h=aoa[hi].map(norm),f=(re,pref)=>{const ix=h.map((c,i)=>re.test(c)?i:-1).filter(i=>i>=0);if(pref){const p=ix.find(i=>pref.test(h[i]));if(p!==undefined)return p}return ix.length?ix[0]:-1};
  const side=dir==='in'?/ban/:/mua/;
  const ci={sym:f(/ky hieu(?! mau)/),no:f(/^so hoa don|^so hd|so hoa don/),date:f(/ngay (lap|hoa don|ky)/),mst:f(/mst|ma so thue/,side),name:f(/^ten |ten nguoi|ten don vi|ten khach/,side),net:f(/chua thue|tien hang/),vat:f(/tien thue|thue gtgt/),total:f(/thanh toan|tong cong|tong tien(?!.*(chua|thue))/),status:f(/trang thai/)};
  if(ci.no<0||ci.date<0)throw new Error('Thiếu cột Số hóa đơn hoặc Ngày');
  const out=[];for(let i=hi+1;i<aoa.length;i++){const r=aoa[i]||[];const no=String(r[ci.no]||'').trim(),date=parseDate(r[ci.date]);if(!no||!date||!/\d/.test(no))continue;
    const net=ci.net>=0?moneyNum(r[ci.net]):0,vat=ci.vat>=0?moneyNum(r[ci.vat]):0,total=ci.total>=0?moneyNum(r[ci.total]):net+vat;
    out.push({no:no.replace(/^0+(?=\d)/,''),symbol:ci.sym>=0?String(r[ci.sym]).trim():'',date,mst:ci.mst>=0?String(r[ci.mst]).trim():'',partyName:ci.name>=0?String(r[ci.name]).trim():'',net,vat:vat||total-net,total,status:ci.status>=0?String(r[ci.status]).trim():''})}
  return out;
}

  if(t==='ncc'){const g={};rows.forEach(x=>{const k=partyKey(x.i),o=g[k]=g[k]||{name:x.i.partyName,cat:x.c.cat,inv:new Set(),amt:0};o.inv.add(x.i.id);o.amt+=x.amt});

/* ================= DANH MỤC HÀNG HÓA (tạm, gom từ hóa đơn đầu vào) ================= */
let dmMemo={v:-1};
function catalog(){
  if(dmMemo.v===ver&&dmMemo.th===(st.dmTh||'0.9'))return dmMemo.g;
  const N={};goodInv('in').forEach(i=>invLines(i).forEach(x=>{const nm=String(x.name||'').trim();if(isCostLine(i,x)){return}if(!nm||num(x.amount)===0&&num(x.price)===0&&/tang kem|khuyen mai/.test(norm(nm)))return;
    const k=norm(nm).replace(/\s+/g,' ')+'|'+norm(x.unit),r=N[k]=N[k]||{key:norm(x.name)+'|'+norm(x.unit),name:nm,unit:x.unit||'',n:0,qty:0,amt:0,last:'',lastPrice:0,minP:Infinity,maxP:0,ncc:new Set()};
    r.n++;r.qty+=num(x.qty);r.amt+=num(x.amount)||num(x.qty)*num(x.price);const p=num(x.price);if(p>0){r.minP=Math.min(r.minP,p);r.maxP=Math.max(r.maxP,p)}
    if((i.date||'')>=r.last){r.last=i.date;r.lastPrice=p}r.ncc.add(i.partyName||'')}));
  // gom theo độ giống tên: so từng cặp ký tự (bỏ dấu, khoảng trắng, ký hiệu); cùng các con số; không khác loại phụ kiện; so với tên đại diện để không nối dây chuyền
  const th=+(st.dmTh||0.9),L=Object.values(N).sort((a,b)=>b.n-a.n),T=L.map(x=>tokOf(x.name)),C=L.map(x=>compact(x.name)),G={},leaders={};
  L.forEach((x,i)=>{const nk=T[i].filter(t=>/\d/.test(t)).sort().join(' '),ls=leaders[nk]=leaders[nk]||[];let best=-1,bs=0;
    for(const j of ls){if(!sameKind(T[i],T[j]))continue;const sc=dice(C[i],C[j]);if(sc>=th&&sc>bs){bs=sc;best=j}}
    x.sim=best<0?1:bs;if(best<0){ls.push(i);G[i]=[x]}else G[best].push(x)});
  const g=Object.values(G).map(items=>{items.sort((a,b)=>b.n-a.n);const c=items.map(x=>cvOf(x.name,x.unit)).find(Boolean),it=c&&c.itemId&&S.items[c.itemId];
    return{items,main:items[0],n:sum(items,x=>x.n),amt:sum(items,x=>x.amt),units:[...new Map(items.filter(x=>x.unit).map(x=>[norm(x.unit),x.unit])).values()],ncc:[...new Set(items.flatMap(x=>[...x.ncc]).filter(Boolean))],last:items.map(x=>x.last).sort().pop()||'',code:it?it.code:'',mapped:items.filter(x=>cvOf(x.name,x.unit)).length}})
   .sort((a,b)=>b.items.length-a.items.length||b.amt-a.amt);
  dmMemo={v:ver,th:st.dmTh||'0.9',g};return g;
}

 }};
A.dmXlsx=()=>{const g=catalog(),rows=[];g.forEach((x,k)=>x.items.forEach(it=>rows.push({'Nhóm':k+1,'Tên đại diện':x.main.name,'Tên trên hóa đơn':it.name,'ĐVT':it.unit,'Số dòng HĐ':it.n,'Tổng SL':+it.qty.toFixed(4),'Giá nhập thấp nhất':it.maxP?it.minP:'','Giá nhập cao nhất':it.maxP||'','Giá gần nhất':it.lastPrice,'Tổng tiền nhập':Math.round(it.amt),'Nhà cung cấp':[...it.ncc].join('; '),'Độ giống':Math.round((it.sim??1)*100)+'%','Mã hàng':x.code})));

function unmapped(){const m={};goodInv().forEach(i=>invLines(i).forEach((x,k)=>{if(cvOf(x.name,x.unit)||isCostLine(i,x))return;const key=norm(x.name)+'|'+norm(x.unit),r=m[key]=m[key]||{key,name:x.name,unit:x.unit||'',n:0,qty:0,id:i.id,ln:k,dirs:new Set()};r.n++;r.qty+=num(x.qty);r.dirs.add(i.dir)}));return Object.values(m).sort((a,b)=>b.n-a.n)}
function mergeSuggest(un){ // gom các tên chưa gán có độ giống cao
  const toks=un.map(u=>tokOf(u.name)),used=new Set(),out=[];
  for(let i=0;i<un.length&&out.length<40;i++){if(used.has(i))continue;const g=[i];
    for(let j=i+1;j<un.length;j++){if(used.has(j))continue;if(simScore(toks[i],toks[j])>=.6)g.push(j)}
    if(g.length>1){g.forEach(x=>used.add(x));out.push(g.map(x=>un[x]))}}
  return out;
}

function xnt(from,to){const m={};
  goodInv().filter(i=>i.date&&i.date<=to).forEach(i=>invLines(i).forEach(x=>{if(isCostLine(i,x))return;const c=conv(x),k=(c.code?'#'+c.code:'@'+norm(c.name))+'|'+norm(c.unit);
    const r=m[k]=m[k]||{code:c.code,name:c.name,unit:c.unit,open:0,inQ:0,outQ:0,inV:0,outV:0};const s=i.dir==='in'?1:-1;
    if(i.date<from)r.open+=s*c.qty;else if(i.dir==='in'){r.inQ+=c.qty;r.inV+=c.amount}else{r.outQ+=c.qty;r.outV+=c.amount}}));
  return Object.values(m).map(r=>({...r,close:r.open+r.inQ-r.outQ})).sort((a,b)=>(a.code?0:1)-(b.code?0:1)||String(a.code).localeCompare(String(b.code))||a.name.localeCompare(b.name,'vi'))}

/* --- Nhập sao kê: bỏ qua giao dịch trùng (cùng tài khoản, ngày, số tiền) --- */
function parseStatement(aoa){
  let hi=-1;for(let i=0;i<Math.min(aoa.length,60);i++){const r=(aoa[i]||[]).map(norm);if(r.filter(c=>/ngay|date|noi dung|dien giai|mo ta|ghi no|ghi co|so tien|debit|credit|so du|rut ra|gui vao|phat sinh|tien ra|tien vao/.test(c)).length>=3){hi=i;break}}
  if(hi<0)throw new Error('Không thấy dòng tiêu đề (Ngày, Nội dung, Số tiền…) trong file');
  const h=aoa[hi].map(norm),f=re=>h.findIndex(c=>re.test(c));
  const ci={date:f(/ngay|date/),debit:f(/ghi no|debit|rut ra|tien ra|chi ra|phat sinh no|so tien no/),credit:f(/ghi co|credit|gui vao|tien vao|thu vao|phat sinh co|so tien co/),amt:f(/^so tien|amount|^gia tri/),desc:f(/noi dung|dien giai|mo ta|chi tiet|description|ghi chu/),bal:f(/so du|balance/)};
  if(ci.date<0||ci.desc<0||(ci.debit<0&&ci.credit<0&&ci.amt<0))throw new Error('Thiếu cột Ngày, Nội dung hoặc Số tiền');
  const out=[];for(let i=hi+1;i<aoa.length;i++){const r=aoa[i]||[],date=parseDate(r[ci.date]);if(!date)continue;
    let a=0;if(ci.debit>=0||ci.credit>=0)a=(ci.credit>=0?Math.abs(moneyNum(r[ci.credit])):0)-(ci.debit>=0?Math.abs(moneyNum(r[ci.debit])):0);else a=moneyNum(r[ci.amt]);
    if(!a)continue;out.push({date,amount:a,desc:String(r[ci.desc]||'').replace(/\s+/g,' ').trim(),balance:ci.bal>=0&&r[ci.bal]!==''?moneyNum(r[ci.bal]):'',seq:out.length})}
  return out;
}
function dedupeRows(accId,rows){const have={};arr(S.bankTx).forEach(t=>{if(t.accountId===accId){const k=t.date+'|'+Math.round(num(t.amount));have[k]=(have[k]||0)+1}});
  const fresh=[];let skip=0;rows.forEach(r=>{const k=r.date+'|'+Math.round(num(r.amount));if(have[k]>0){have[k]--;skip++}else fresh.push(r)});return{fresh,skip}}
async function writeTx(accId,rows,seq0){const docs=rows.map((r,i)=>{const k=txKey(accId,r.date,r.amount,r.desc,r.balance);let id=txId(k),n=1;while(S.bankTx[id])id=txId(k)+'_'+(n++);
  const d={accountId:accId,date:r.date,amount:num(r.amount),desc:String(r.desc||''),balance:r.balance===''||r.balance==null?'':num(r.balance),seq:(seq0||0)+(r.seq??i),key:k,at:new Date().toISOString()};S.bankTx[id]=d;return[id,d]});
  await pool(docs,([id,d])=>put('bankTx',id,d),4,(a,b)=>setProg(`Đang lưu giao dịch ${accName(accId)}: ${a}/${b}…`));setProg('');ver++;return docs.length}

  modal({title:'Nhập sao kê ngân hàng',wide:true,body:`<div class="fg">${F('bi_acc','Tài khoản',st.ba||accs[0]?.id,{type:'select',opts:accs.map(a=>[a.id,accName(a.id)])})}<label class="f"><span>File sao kê (Excel hoặc CSV tải từ ngân hàng)</span><input type="file" id="bi_f" accept=".xlsx,.xls,.csv"></label></div><div id="bi_prev" style="margin-top:10px"></div>`,ok:'Nhập giao dịch mới',

     const n=await writeTx(acc,fresh,Date.now()%1e7*100);await markSync('bank_'+acc,'Sao kê '+accName(acc),n,skip?skip+' GD trùng đã bỏ qua':'');logAct(`nhập sao kê ${accName(acc)}: ${n} giao dịch mới, bỏ ${skip} trùng`);toast(`Đã nhập ${n} giao dịch mới, bỏ qua ${skip} giao dịch trùng`)}});
  const prev=()=>{const p=$('#bi_prev');if(!rows.length)return;const {fresh,skip}=dedupeRows(V('bi_acc'),rows);
    p.innerHTML=`<p>Đọc được <b>${rows.length}</b> giao dịch: <b>${fresh.length}</b> mới, <b>${skip}</b> trùng (cùng tài khoản, ngày, số tiền) sẽ bỏ qua.</p>`+table([['Ngày'],['Số tiền','r'],['Nội dung']],fresh.slice(0,8).map(r=>({c:[dmy(r.date),vnd(r.amount),esc(r.desc)]})))};

/* ================= NHÂN SỰ: dữ liệu từ phần mềm Chấm Công Công Trình ================= */
const CCDEF={start:'08:00',end:'17:00',lunchStart:'12:00',lunchEnd:'13:00',stdHours:8,otMult:1.5,sunMult:1.5,roundMin:15,congRound:'exact'};
const CCSHIFT={A:{start:'08:00',lunchStart:'12:00',lunchEnd:'13:00',end:'17:00'},B:{start:'08:00',lunchStart:'12:00',lunchEnd:'13:30',end:'17:30'}};
const ccCfg=()=>({...CCDEF,...((S.ccMeta||{}).cfg||{})});
const toMinCC=s=>{if(!s)return null;const [h,m]=String(s).split(':').map(Number);return isNaN(h)?null:h*60+(m||0)};
const ovCC=(a,b,c,d)=>Math.max(0,Math.min(b,d)-Math.max(a,c));
const isSunCC=s=>new Date(s+'T00:00:00').getDay()===0;
const r2=n=>Math.round((n||0)*100)/100;
function ccCalc(e){ // giống hệt cách tính của phần mềm chấm công
  const cfg=ccCfg(),sun=isSunCC(e.date);
  if(e.live)return{cong:0,ot:0,sun,open:true};
  if(e.v===2||'hc' in e||'otH' in e){let cong=+e.hc||0,ot=+e.otH||0;if(sun){ot+=cong*(+cfg.stdHours||8);cong=0}return{cong:r2(cong),ot:r2(ot),sun,open:false}}
  const sh=CCSHIFT[(S.cc_projects[e.projectId]||{}).shift],c=sh?{...cfg,...sh}:cfg,i=toMinCC(e.in),o0=toMinCC(e.out);
  let cong=0,ot=0;const open=!!e.in&&!e.out;
  if(i!=null&&o0!=null){let o=o0;if(o<=i)o+=1440;
    const reg=ovCC(i,o,toMinCC(c.start),toMinCC(c.lunchStart))+ovCC(i,o,toMinCC(c.lunchEnd),toMinCC(c.end));
    let otm=ovCC(i,o,toMinCC(c.end),99999);const rd=+c.roundMin||1;otm=Math.floor(otm/rd)*rd;
    cong=reg/60/(+c.stdHours||8);if(c.congRound==='half')cong=Math.round(cong*2)/2;cong=Math.min(1,r2(cong));ot=otm/60}
  if(typeof e.congOv==='number')cong=e.congOv;if(typeof e.otOv==='number')ot=e.otOv;
  return{cong,ot,sun,open};
}

const ccProj=e=>{const p=e.projectId&&S.cc_projects[e.projectId];return p?p.name+(p.code?' · '+p.code:''):(String(e.projectName||'').trim()||'(Chưa ghi công trình)')};

  return rows.sort((a,b)=>(a.date+(a.in||'')).localeCompare(b.date+(b.in||'')))}

function ccAgg(rows){const E={},P={};rows.forEach(r=>{const e=E[r.empId]=E[r.empId]||{wk:0,sunH:0,otWk:0,days:new Set(),open:0,proj:{}},p=P[r.proj]=P[r.proj]||{cong:0,ot:0,emps:new Set()};
  if(r.sun)e.sunH+=r.ot;else{e.wk+=r.cong;e.otWk+=r.ot}if(r.cong>0||r.ot>0)e.days.add(r.date);if(r.open)e.open++;e.proj[r.proj]=(e.proj[r.proj]||0)+r.cong;
  p.cong+=r.cong;p.ot+=r.ot;p.emps.add(r.empId)});return{E,P}}

  const ids=[...new Set([...Object.keys(S.users),...Object.keys(S.requests)])].filter(x=>x!==me);

  `<h3 style="margin:0 0 6px">Vai trò trong phần mềm</h3>`+table([['Tài khoản'],['Vai trò'],['Trạng thái']],ids.map(id=>({c:[esc(names[id]||'Người dùng '+id.slice(2,8)),`<select data-setrole="${id}" style="width:auto"><option value="xem"${(S.users[id]||{}).role!=='ketoan'?' selected':''}>Chỉ xem</option><option value="ketoan"${(S.users[id]||{}).role==='ketoan'?' selected':''}>Kế toán</option></select>`,S.users[id]?pill('Đã cấp','good'):pill('Đang chờ','warn')]})),{empty:'Chưa có ai đề nghị quyền kế toán.'})+
  `<h3 style="margin:18px 0 6px">Nhật ký hoạt động</h3>`+table([['Thời gian'],['Người làm'],['Việc']],logs.map(l=>({c:[`<span class="nw">${dmy(l.at)} ${String(l.at).slice(11,16)}</span>`,esc(names[l.uid]||(l.uid===me?'Tôi':'Người dùng')),esc(l.text)]})),{empty:'Chưa có hoạt động.'});

document.addEventListener('change',async e=>{const id=e.target.dataset&&e.target.dataset.setrole;if(!id||role!=='admin')return;
  await put('users',id,{role:e.target.value,at:new Date().toISOString()});logAct('đặt vai trò '+ROLES[e.target.value]+' cho '+(names[id]||'người dùng'));toast('Đã cập nhật')});

/* ================= Nhận dữ liệu tự động (hộp thư + gói 2026) ================= */
let inboxBusy=false;
async function processInbox(){
  if(inboxBusy||!canWrite())return;
  const items=Object.entries(S.inbox).filter(([,d])=>d&&!d.done&&(d.kind==='inv_in'||d.kind==='inv_out'||d.kind==='inv_lines'||d.kind==='bank'||(!d.kind&&d.bankName&&Array.isArray(d.rows)))&&!(inboxType(d)==='canhan'&&!isOwner()));if(!items.length)return;
  inboxBusy=true;let total=0;
  try{for(const [id,d] of items){let n=0,skip=0;const rows=(d.rows&&d.rows.length)?d.rows:(d.csv?d.csv.split(';').map(x=>x.split(',').map(s=>s.trim())):[]);
    if(d.kind==='inv_out'||d.kind==='inv_in'){const dir=d.kind==='inv_out'?'out':'in',todo=[];
      for(const r of rows){const [symbol,no,date,party,net,tot,status,pName]=r;if(BADINV({status})){skip++;continue}
        const isName=!/^\d{10}(-\d{3})?$/.test(String(party)),mst=isName?'':String(party);
        const inv={dir,no:String(no),symbol,date,partyName:pName||(isName?String(party).replace(/\s*-\s*Khách hàng không cung cấp thông tin/i,''):'MST '+mst),mst,net:num(net),vat:num(tot)-num(net),total:num(tot),vatRate:num(net)?Math.round((num(tot)-num(net))/num(net)*100):0,source:d.source||'tự động',status:status||'',by:me,createdAt:new Date().toISOString()};
        inv.key=invKey(inv);const iid=ivId(inv.key);if(S.invoices[iid]){skip++;continue}S.invoices[iid]=inv;todo.push([iid,inv])}
      await pool(todo,([iid,inv])=>put('invoices',iid,inv),4,(a,b)=>setProg(`Đang nạp hóa đơn ${dir==='out'?'đầu ra':'đầu vào'} ${a}/${b}…`));n=todo.length;
      await markSync(dir==='out'?'ehd_out':'gdt_in',dir==='out'?'Hóa đơn đầu ra':'Hóa đơn đầu vào',n,skip?skip+' bỏ qua':'');
    }else if(d.kind==='inv_lines'){const todo=[];
      for(const r of rows){const [dir,symbol,no,mst,lines]=r;const iid=ivId([dir,symbol||'',String(no),dir==='in'?String(mst||''):OURMST()].join('|')),inv=S.invoices[iid];
        if(!inv||invLines(inv).length||BADINV(inv)){skip++;continue}
        const ls=(lines||[]).map(l=>({name:String(l[0]||'').trim(),unit:String(l[1]||'').trim(),qty:num(l[2]),price:num(l[3]),amount:num(l[4])})).filter(l=>l.name);if(!ls.length){skip++;continue}
        inv.lines=ls;todo.push([iid,ls])}
      await pool(todo,([iid,ls])=>patch('invoices',iid,{lines:ls}),4,(a,b)=>setProg(`Đang nạp chi tiết hàng hóa ${a}/${b}…`));n=todo.length;
    }else{ // sao kê ngân hàng
      let a=(d.accountId&&S.bank[d.accountId])?{id:d.accountId}:findAcc(d.bankName||'',d.last4||'');
      if(!a){const nid=uid(),doc={bankName:d.bankName||'Khác',accountNo:String(d.last4||'').slice(-4),name:d.name||'',opening:0,type:d.type||'cty'};await put('bank',nid,doc);S.bank[nid]=doc;a={id:nid}}
      const rs=rows.map((r,i)=>({date:r[0],amount:num(r[1]),desc:r[2],balance:r[3],seq:(d.seq0||0)+i})).filter(r=>r.date&&r.amount);
      const {fresh,skip:sk}=dedupeRows(a.id,rs);skip=sk;n=await writeTx(a.id,fresh,0);
      await markSync('bank_'+a.id,'Sao kê '+accName(a.id),n,skip?skip+' GD trùng':'');
    }
    await put('inbox',id,{kind:d.kind||'bank',bankName:d.bankName||'',source:d.source||'',rows:[],csv:'',done:true,doneAt:new Date().toISOString(),count:n,skipped:skip});S.inbox[id].done=true;total+=n;ver++;
  }
  if(total){logAct('tự động nạp '+total+' dòng dữ liệu');toast('Đã nạp '+total+' dòng dữ liệu mới')}refresh();
  }catch(e){console.error(e);toast('Nạp dữ liệu tự động bị lỗi: '+(e.message||e.code),'bad')}
  finally{inboxBusy=false;setProg('')}
}
let packTried=false;
async function loadPack(){ // gói dữ liệu 2026 từ thư mục Thi Đạt, chỉ nạp một lần
  if(packTried||!canWrite())return;packTried=true;if(S.inbox.pack26v1&&S.inbox.pack26v1.done)return;
  try{const res=await fetch('pack2026.json');if(!res.ok)return;const pk=await res.json();setProg('Đang đưa gói dữ liệu 2026 vào hộp thư…');
    for(const id of pk.order){if(S.inbox[id])continue;const d=pk.docs[id];if(!d.kind&&d.bankName)d.kind='bank';await put('inbox',id,d);S.inbox[id]=d}
    await processInbox();
    for(const [iid,inv] of Object.entries(S.invoices)){const m=/^MST (\S+)/.exec(inv.partyName||'');const nm=m&&pk.names[m[1]];if(nm){try{await patch('invoices',iid,{partyName:nm});inv.partyName=nm}catch(e){}}}
    await put('inbox','pack26v1',{kind:'marker',done:true,doneAt:new Date().toISOString()});
  }catch(e){console.error(e)}finally{setProg('')}
}
let autoRan=false;
async function migratePersonal(){ // chuyển dữ liệu cá nhân cũ sang vùng riêng (chỉ chủ chạy)
  if(!isOwner())return;const ids=new Set(arr(S.bank).filter(a=>(a.type||'cty')==='canhan').map(a=>a.id));if(!ids.size)return;
  const accs=arr(S.bank).filter(a=>ids.has(a.id)&&!PERS.bank.has(a.id)),txs=arr(S.bankTx).filter(t=>ids.has(t.accountId)&&!PERS.bankTx.has(t.id));if(!accs.length&&!txs.length)return;
  setProg('Đang chuyển tài khoản cá nhân sang vùng riêng chỉ chị xem được…');
  const strip=o=>{const {id,...r}=o;return r};
  for(const a of accs){await retry(()=>db.doc('pbank/'+a.id).set(strip(a)));PERS.bank.add(a.id)}
  await pool(txs,async t=>{await retry(()=>db.doc('pbankTx/'+t.id).set(strip(t)));PERS.bankTx.add(t.id)},4,(x,y)=>setProg(`Đang chuyển giao dịch cá nhân ${x}/${y}…`));
  await pool(txs,t=>retry(()=>db.doc('bankTx/'+t.id).delete()),4);
  for(const a of accs)await retry(()=>db.doc('bank/'+a.id).delete());
  setProg('');ver++;logAct('chuyển '+accs.length+' tài khoản và '+txs.length+' giao dịch cá nhân sang vùng riêng');toast('Đã khóa dữ liệu ngân hàng cá nhân: chỉ chủ tài khoản xem được')}
async function autoOnLoad(){if(autoRan||!canWrite())return;autoRan=true;await sleep(1500);try{await migratePersonal()}catch(e){console.error(e);setProg('')}try{await seedAccounts()}catch(e){console.error(e)}await loadPack();await processInbox();await autoSync();refresh()}

/* ================= Khung ứng dụng ================= */
const MENU=[['',[['dash','Tổng quan'],['warn','Cảnh báo']]],['Hóa đơn',[['hdin','Hóa đơn đầu vào'],['hdout','Hóa đơn đầu ra'],['danhmuc','Danh mục hàng hóa'],['chiphi','Hàng chi phí'],['mahang','Mã hàng'],['xnt','Xuất nhập tồn']]],['Ngân hàng',[['bankcty','Công ty'],['bankcn','Cá nhân'],['banktong','Tổng']]],['Khác',[['quotes','Báo giá'],['contracts','Hợp đồng'],['customers','Khách hàng'],['suppliers','Nhà cung cấp'],['team','Nhân sự']]]];
function render(){
  const root=$('#root');if(!role)return;if(!VIEWS[view]||(view==='bankcn'&&!isOwner()))view='dash';
  if(!$('.app',root))root.innerHTML=`<div class="app"><aside class="side"><div class="brand">Thi Đạt<small>Quản lý bán hàng</small></div><nav class="nav" id="nav" aria-label="Menu"></nav><div class="me" id="me"></div></aside><main class="main" id="main"><div class="prog" id="prog" style="display:none"></div><div class="head"><h1 id="ttl"></h1><div id="hdact" class="hdact"></div></div><div class="bar" id="bar"></div><div id="body"></div></main></div>`;
  let al=0;try{al=M().pend.length}catch(e){}
  $('#nav').innerHTML=MENU.map(([g,l])=>(g?`<div class="grp">${g}</div>`:'')+l.filter(([k])=>k!=='bankcn'||isOwner()).map(([k,t])=>`<button class="${k===view?'on':''}" data-act="go" data-id="${k}">${t}${k==='warn'&&al?`<span class="cnt">${al}</span>`:''}</button>`).join('')).join('');
  $('#me').innerHTML=`<b>${esc(names[me]||'Tài khoản của tôi')}</b>${ROLES[role]}${role==='xem'&&!S.requests[me]?`<br><button class="btn sm" style="margin-top:6px" data-act="reqRole">Đề nghị quyền kế toán</button>`:''}`;
  const V_=VIEWS[view];$('#ttl').textContent=V_.title;$('#hdact').innerHTML=headAct();$('#bar').innerHTML=V_.bar();
  try{$('#body').innerHTML=V_.body()}catch(e){console.error(e);$('#body').innerHTML='<div class="card neg">Lỗi hiển thị: '+esc(e.message)+'</div>'}
  setProg(progText);
}
let rt=null;
function refresh(){if(rt)return;rt=setTimeout(()=>{rt=null;if(!role)return gate();{const ae=document.activeElement;if(ae&&ae.classList&&ae.classList.contains('ie')){metaPending=true;return}}const b=$('#body');if(!b)return render();
  const m=$('#main'),y=m?m.scrollTop:0,ae=document.activeElement,bound=ae&&ae.dataset&&ae.dataset.bind;
  const tw=$$('.tw',b).map(x=>[x.scrollTop,x.scrollLeft]);
  render();if(m)m.scrollTop=y;$$('.tw',$('#body')).forEach((x,i)=>{if(tw[i]){x.scrollTop=tw[i][0];x.scrollLeft=tw[i][1]}});
  if(bound){const e=$(`[data-bind="${bound}"]`);if(e){e.focus();if(e.setSelectionRange&&e.type==='search')e.setSelectionRange(e.value.length,e.value.length)}}},250)}
function go(v){view=v;render();const m=$('#main');if(m)m.scrollTop=0}
A.go=d=>{closeModal();go(d.id)};A.close=closeModal;
A.reqRole=async()=>{try{await put('requests',me,{at:new Date().toISOString(),want:'ketoan'});toast('Đã gửi đề nghị, chờ chị Huyền Thi cấp quyền')}catch(e){toast('Không gửi được. Bạn cần được mời với quyền Contributor.','bad')}};
document.addEventListener('click',e=>{if(e.target.closest('.ie'))return;const t=e.target.closest('[data-act]');if(!t)return;const f=A[t.dataset.act];if(f){e.preventDefault();e.stopPropagation();f(t.dataset,t)}});
let bt=null;
function bindUpdate(e){const k=e.target.dataset&&e.target.dataset.bind;if(!k)return;st[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;
  clearTimeout(bt);bt=setTimeout(()=>{const b=$('#body');if(b)try{b.innerHTML=VIEWS[view].body()}catch(err){console.error(err)}},e.type==='input'?220:0)}
document.addEventListener('input',e=>{if(e.target.type==='checkbox'||e.target.tagName==='SELECT'||e.target.type==='date')return;bindUpdate(e)});
document.addEventListener('change',e=>{if(e.target.type==='checkbox'||e.target.tagName==='SELECT'||e.target.type==='date'){bindUpdate(e);if(e.target.dataset.bind==='ba')setTimeout(()=>{$('#bar').innerHTML=VIEWS[view].bar()},10)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
async function loadNames(){if(!usr||!usr.profiles)return;
  const ids=[...new Set([me,...Object.keys(S.users),...Object.keys(S.requests),...Object.values(S.log).map(l=>l.uid)].filter(Boolean))].filter(i=>!(i in names));if(!ids.length)return;
  ids.forEach(i=>names[i]='');try{const ps=await usr.profiles(ids);ids.forEach(i=>{const n=ps&&ps[i]&&ps[i].name;if(n)names[i]=n});refresh()}catch(e){}}

/* ================= Phân quyền và khởi động ================= */
function gate(){
  const isAdmin=usr&&(usr.canEdit()||usr.isOwner()),u=S.users[me];
  role=isAdmin?'admin':(u&&u.role==='ketoan'?'ketoan':'xem');
  render();loadNames();autoOnLoad();
}
(async function boot(){
  const root=$('#root');
  try{
    db=await claude.use('db');usr=await claude.use('user');dl=await claude.use('downloads');
    if(!db||!usr){root.innerHTML='<div class="center"><h1>Quản lý bán hàng Thi Đạt</h1><p class="mute">Hãy mở phần mềm trong Claude và đăng nhập bằng tài khoản đã được chia sẻ.</p></div>';return}
    me=await usr.id();if(!me){root.innerHTML='<div class="center"><p class="mute">Không xác định được tài khoản. Hãy đăng nhập Claude rồi tải lại trang.</p></div>';return}
    const keys=[...COLS,'settings','status','req','pbank','pbankTx'];let pending=keys.length,started=false;
    const done=()=>{if(--pending===0&&!started){started=true;gate()}};
    COLS.forEach(c=>{let first=true;db.collection(c).onSnapshot(snap=>{snap.docChanges().forEach(ch=>{if(ch.type==='removed'){if(!(PERS[c]&&PERS[c].has(ch.doc.id)))delete S[c][ch.doc.id]}else S[c][ch.doc.id]=ch.doc.data()});ver++;if(first){first=false;done()}else refresh()},err=>{console.error(c,err);if(first){first=false;done()}})});
    [['pbank','bank'],['pbankTx','bankTx']].forEach(([pc,c])=>{let first=true;db.collection(pc).onSnapshot(snap=>{snap.docChanges().forEach(ch=>{if(ch.type==='removed'){PERS[c].delete(ch.doc.id);delete S[c][ch.doc.id]}else{PERS[c].add(ch.doc.id);S[c][ch.doc.id]=ch.doc.data()}});ver++;if(first){first=false;done()}else refresh()},()=>{if(first){first=false;done()}})});
    let f1=true,f2=true,f3=true;
    db.doc('settings/main').onSnapshot(s=>{S.settings=s.exists?s.data():{};ver++;if(f1){f1=false;done()}else refresh()},()=>{if(f1){f1=false;done()}});
    db.doc('sync/status').onSnapshot(s=>{S.sync=s.exists?s.data():{};if(f2){f2=false;done()}else refresh()},()=>{if(f2){f2=false;done()}});
    db.doc('cc_meta/sync').onSnapshot(s=>{S.ccMeta=s.exists?s.data():{};ver++;refresh()},()=>{});
    db.doc('sync/request').onSnapshot(s=>{S.syncReq=s.exists?s.data():null;if(f3){f3=false;done()}else refresh()},()=>{if(f3){f3=false;done()}});
    db.collection('log').orderBy('at','desc').limit(80).onSnapshot(snap=>{S.log={};snap.docs.forEach(d=>S.log[d.id]=d.data());refresh()},()=>{});
    setTimeout(()=>{if(!started){started=true;gate();toast('Một phần dữ liệu chưa tải xong, có thể chưa đầy đủ','bad')}},10000);
  }catch(e){console.error(e);root.innerHTML='<div class="center"><p class="neg">Không khởi động được phần mềm: '+esc(e.message||e.code||'lỗi')+'</p></div>'}
})();
</script>
